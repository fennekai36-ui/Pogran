function normalizeSave(){s.silver=Math.max(0,Math.floor(Number(s.silver)||0));s.gold=Math.max(0,Math.floor(Number(s.gold)||0))+Math.floor(s.silver/100);s.silver%=100;delete s.bronze;s.equipment=s.equipment&&typeof s.equipment==='object'?s.equipment:{};if(s.weapon){s.equipment.sword={slot:'sword',set:'recruit',rarity:0,quality:{health:25,str:100,armorStat:25,agi:25},stats:{health:0,str:s.weapon,armorStat:0,agi:0}};s.weapon=0}if(s.armor){s.equipment.armor={slot:'armor',set:'recruit',rarity:0,quality:{health:25,str:25,armorStat:100,agi:25},stats:{health:0,str:0,armorStat:s.armor,agi:0}};s.armor=0}s.bag=s.bag.map(it=>it.slot?it:it.type?{slot:it.type==='weapon'?'sword':'armor',set:'recruit',rarity:0,quality:{health:25,str:25,armorStat:25,agi:25},stats:{health:0,str:it.type==='weapon'?it.value:0,armorStat:it.type==='armor'?it.value:0,agi:0}}:null).filter(Boolean)}

tion')}<span>Зелья</span><b>${s.potions}</b></div></div><div class="currency-rate">1 зол. = 100 сер.</div></div><div class="card premium-line">Премиум: в разработке</div><div class="profile-links card">${profileLink('Статистика','stats')}${profileLink('Настройки','settings')}</div>`}
function profileGear(){return `<div class="card profile-section"><h2>Снаряжение</h2><div class="gear-grid">${slotSpecs.map(([slot,label])=>{const it=s.equipment?.[slot],rarity=it?itemRarity(it):null;return `<div class="gear-slot ${it?'is-equipped rarity-'+rarity.className:'is-empty'}"><span class="slot-icon">${it?itemIcon(it):icon(slot)}</span><div><small>${label.toUpperCase()}</small><b>${it?itemName(it):'Пусто'}</b>${it?`<small class="item-rarity">${rarity.name}</small>${itemStats(it)}${button('Снять','unequip:'+slot,false,'unequip-button')}`:''}</div></div>`}).join('')}</div></div>`}
function profileBag(){return `<div class="card profile-section"><h2>Сумка</h2>${s.bag.map((it,i)=>{const rarity=itemRarity(it),difference=itemDelta(it);return `<div class="inventory-row rarity-${rarity.className}"><span class="inventory-icon">${itemIcon(it)}</span><div class="inventory-text"><b>${itemName(it)} <span class="${deltaClass(difference)}">(${signed(difference)})</span></b><small class="item-rarity">${rarity.name}</small>${itemStats(it,true)}</div><div class="inventory-actions">${button('Надеть','equip:'+i,!!s.battle||s.level<setSpecs[it.set].level,'inventory-action')}${button('Продать · 8 сер.','sell:'+i,!!s.battle,'subtle-action')}</div></div>`}).join('')}${!s.bag.length?'<div class="empty-bag">Пусто</div>':''}${button(s.bag.length?'Разобрать всё · +'+bagDust()+' пыли':'Разобрать всё','salvageAll',!s.bag.length||!!s.battle,'full-button')}</div>`}
function profileSkills(){return `<div class="card profile-section"><h2>Умения</h2><div class="skill-row"><b>${icon('sword')}Удар</b><span>Обычный урон</span></div><div class="skill-row"><b>${icon('shield')}Защита</b><span>−70% входящего урона</span></div><div class="skill-row"><b>${icon('fist')}Мощный выпад</b><span>Двойной урон, 2 хода восстановления</span></div></div>`}
function profileMail(){return `<div class="card profile-section"><h2>Почта</h2>${mailLoading?'<div class="empty-bag">Загрузка…</div>':mailMessages.length?mailMessages.map(m=>`<article class="mail-item"><b>${escapeHtml(m.subject)}</b><p>${escapeHtml(m.body)}</p></article>`).join(''):'<div class="empty-bag">Нет писем</div>'}</div>`}
function profileStats(){return `<div class="card profile-section"><h2>Статистика</h2><div class="stats-content"><span>Победы</span><strong>${s.kills}</strong></div><div class="stats-content"><span>Побеждённые главари</span><strong>${s.boss}</strong></div></div>`}
function profileSettings(){return `<div class="card profile-section"><h2>Настройки</h2>${authSession?`<div class="account-email">${escapeHtml(authSession.user.email)}</div>`:'<div class="account-email">Тестовый персонаж · сохранение в этом браузере</div>'}${button('Скачать сохранение','downloadSave',false,'full-button')}<label class="full-button save-upload">Загрузить сохранение<input id="save-file" type="file" accept=".json,application/json"></label>${cloudConfig&&!authSession?button('Регистрация и вход','profile:auth',false,'full-button'):''}${authSession?button('Выйти','logout',false,'full-button'):''}</div>`}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function profileAuth(){return `<div class="card profile-section"><h2>${authMode==='register'?'Регистрация':'Вход'}</h2>${authMessage?`<div class="notice" role="status">${escapeHtml(authMessage)}</div>`:''}${cloudConfig?'':'<div class="notice">База данных ещё не подключена.</div>'}<form id="auth-form" class="auth-form"><label>Почта<input name="email" type="email" autocomplete="email" required></label><label>Пароль<input name="password" type="password" minlength="8" autocomplete="${authMode==='register'?'new-password':'current-password'}" required></label><button type="submit" class="primary" ${cloudConfig?'':'disabled'}>${authMode==='register'?'Зарегистрироваться':'Войти'}</button></form>${button(authMode==='register'?'Уже есть аккаунт? Войти':'Создать аккаунт','authMode:'+(authMode==='register'?'signin':'register'),false,'auth-switch')}</div>`}
const patterns=[
 [{name:'Обычный укус',detail:'Обычная атака.',power:1}, {name:'Прыжок',detail:'Сильный удар. Защита снизит урон.',power:1.8}, {name:'Переводит дух',detail:'Слабая атака. Удобный момент для выпада.',power:.5}],
 [{name:'Поднимает щит',detail:'Получит меньше урона в этот ход.',power:.6,block:.35}, {name:'Удар клинком',detail:'Обычная атака.',power:1}, {name:'Замах',detail:'Сильный удар. Защита снизит урон.',power:1.7}],
 [{name:'Тяжёлый замах',detail:'Очень сильный удар. Защита снизит урон.',power:1.9}, {name:'Прикрывается',detail:'Получит меньше урона в этот ход.',power:.75,block:.5}, {name:'Быстрый выпад',detail:'Обычная атака.',power:1}]
];
function intent(b){return patterns[b.enemy.area][(b.turn-1)%patterns[b.enemy.area].length]}
function strikePercent(elapsed){return Math.max(1,Math.min(100,1+(Math.max(100,elapsed)-100)*99/2900))}
function battleView(){const b=s.battle,a=b.enemy;return `<div class="card arena-battle"><div class="eyebrow">${locations[b.location||0].name.toUpperCase()}</div><h2>${a.name}</h2><div class="row"><small>Здоровье противника</small><span>${a.hp} / ${a.maxHp}</span></div>${meter(a.hp,a.maxHp)}<div class="intent"><strong>${intent(b).name}</strong> · ${intent(b).detail}</div>${button('Атаковать · '+Math.round(strikePercent(Date.now()-b.lastAttackAt))+'%','fight:hit',false,'primary arena-attack')}<div class="actions arena-tools">${button('Защита','fight:guard')}${button(b.cooldown?'Выпад · '+b.cooldown:'Мощный выпад','fight:skill',b.cooldown>0)}${button(potionLabel(true),'fight:potion',!canDrinkPotion(),'potion-use')}</div></div><div class="card"><div class="log" aria-live="polite">${b.log.slice(-4).map(l=>typeof l==='string'?`<p>${escapeHtml(l)}</p>`:`<p class="loot rarity-${l.rarity}">${escapeHtml(l.text)}</p>`).join('')}</div>${button('Покинуть локацию','flee',false,'full-button')}</div>`}
function enemyTick(){const b=s.battle;if(!b)return;const now=Date.now();let changed=false;while(s.battle&&now>=b.nextBiteAt){const a=b.enemy,move=intent(b),damage=Math.max(1,Math.round(a.atk*(1-armorPercent()/100)*move.power*(b.guarding?.3:1)));s.hp=Math.max(0,s.hp-damage);b.log.push(`${a.name}: ${damage} урона вам.`);b.guarding=false;b.nextBiteAt+=3000;b.turn++;changed=true;if(s.hp===0){s.battle=null;notice='Поражение. Восстановите здоровье.';tab='town'}}if(changed){queueCloudSave();render()}}
function act(action){const [type,arg]=action.split(':');notice='';if(type==='downloadSave'){downloadSave();return}if(type==='tab'){tab=arg;if(arg==='hero')profilePage='overview';render();return}if(type==='profile'){profilePage=arg;tab='hero';render();if(arg==='mail')loadMail();return}if(type==='authMode'){authMode=arg;authMessage='';render();return}if(type==='logout'){logout();return}if(s.battle&&!['fight','flee'].includes(type)){notice='Завершите бой перед этим действием.';render();return}
if(type==='start'&&s.hp>0){const locationId=Number(arg||0);if(!locations[locationId]||s.level<locations[locationId].min){render();return}s.battle={location:locationId,wave:1,wins:0,enemy:nextFoe(1,-1,locationId),turn:1,cooldown:0,log:[],lastAttackAt:Date.now()-3000,nextBiteAt:Date.now()+3000,guarding:false};tab='journey'}
if(type==='fight')fight(arg);
if(type==='flee'&&s.battle){s.battle=null;tab='journey'}
if(type==='potion'&&!s.battle)drinkPotion()
if(type==='unequip'&&s.equipment[arg]){const oldMax=maxhp();s.bag.push(s.equipment[arg]);delete s.equipment[arg];s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)))}
if(type==='salvageAll'&&s.bag.length){const count=s.bag.length,dust=bagDust();s.dust=(s.dust||0)+dust;s.bag=[];notice=`Разобрано ${count} вещей. +${dust} пыли.`}
if(type==='claim'&&s.kills>=5&&!s.claimed){s.claimed=true;addSilver(50);notice='Получено 50 серебра.'}
if(['equip','sell'].includes(type)&&s.bag[Number(arg)]){const it=s.bag[Number(arg)];if(type==='equip'&&s.level<setSpecs[it.set].level){notice=`Требуется ${setSpecs[it.set].level} уровень.`}else{const oldMax=maxhp();s.bag.splice(Number(arg),1);if(type==='sell')addSilver(8);else{const prev=s.equipment[it.slot];s.equipment[it.slot]=it;if(prev)s.bag.push(prev);s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)));notice='Снаряжение надето.'}}}
queueCloudSave();render()}
function fight(move){enemyTick();const b=s.battle;if(!b)return;const a=b.enemy,enemyMove=intent(b);if(!['hit','guard','skill','potion'].includes(move)||move==='skill'&&b.cooldown>0||move==='potion'&&!canDrinkPotion())return;
if(move==='potion')drinkPotion();else{const percent=strikePercent(Date.now()-b.lastAttackAt);b.lastAttackAt=Date.now();const critical=Math.random()*100<critPercent();const raw=attack()*(move==='skill'?2:move==='guard'?.45:1)*(critical?1.5:1)*percent/100;const damage=Math.max(1,Math.round(raw*(enemyMove.block??1)));a.hp=Math.max(0,a.hp-damage);b.log.push(`${move==='skill'?'Мощный выпад':move==='guard'?'Осторожный удар':'Ваш удар'}: ${damage} урона (${Math.round(percent)}%)${critical?' · крит':''}.`);if(move==='guard')b.guarding=true}
if(a.hp<=0){s.kills++;b.wins++;s.souls=(s.souls||0)+1;s.xp+=a.xp;if(a.kind===5)s.boss++;b.log.push(`+1 душа · +${a.xp} опыта.`);if(rollGearDrop()){const slot=slotSpecs[Math.floor(Math.random()*slotSpecs.length)][0],setId=locations[b.location||0].set,item=makeItem(slot,setId);s.bag.push(item);b.log.push({text:`Найдено: ${itemName(item)}.`,rarity:itemRarity(item).className})}if(Math.random()<.01){s.potions++;b.log.push('Найдено зелье здоровья.')}while(s.xp>=need()){s.xp-=need();s.level++;for(const stat of ['health','str','armorStat','agi'])s[stat]+=5;s.hp=maxhp();b.log.push(`Уровень ${s.level}: +5 к каждому параметру.`)}const previous=a.kind;b.wave++;b.enemy=nextFoe(b.wave,previous,b.location||0);b.turn=1;b.cooldown=0;b.guarding=false;b.nextBiteAt=Date.now()+3000;b.log.push(`Появляется ${b.enemy.name}.`);return}
b.cooldown=move==='skill'?2:Math.max(0,b.cooldown-1)}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action)});document.addEventListener('change',e=>{if(e.target.id==='save-file')importSave(e.target.files?.[0])});document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();submitAuth(e.target)}});if(typeof setInterval==='function')setInterval(()=>{enemyTick();const button=document.querySelector?.('.arena-attack');if(button&&s.battle)button.textContent=`Атаковать · ${Math.round(strikePercent(Date.now()-s.battle.lastAttackAt))}%`;const potionButton=document.querySelector?.('.potion-use');if(potionButton){potionButton.textContent=potionLabel(!!s.battle);potionButton.disabled=!canDrinkPotion()||tab==='hero'&&!!s.battle}const before=s.hp;applyRegen();if(s.hp!==before){const wasOpen=document.querySelector?.('.stats-tab')?.open;render();if(wasOpen){const stats=document.querySelector?.('.stats-tab');if(stats)stats.open=true}}},250);normalizeSave();render();
</script></body></html>
