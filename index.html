function itemName(it){const names={helmet:'Шлем',shoulder:'Наплечники',gauntlet:'Перчатки',greaves:'Поножи',armor:'Доспех',necklace:'Ожерелье',cloak:'Плащ',ring:'Кольцо',sword:'Меч',boots:'Сапоги'};return `${names[it.slot]||'Предмет'} ${setSpecs[it.set]?.name||'рекрута'}${it.sharpen?' +'+it.sharpen:''}`}
function itemIcon(it){const slot=slotSpecs.find(x=>x[0]===it.slot),position=slot?.[2]||0;return `<span class="set-icon set-${it.set}" style="--sx:${position%5*25}%;--sy:${position<5?0:100}%" aria-hidden="true"></span>`}
function statDelta(it,key){return (Number(it.stats[key])||0)-(Number(s.equipment?.[it.slot]?.stats?.[key])||0)}
function itemDelta(it){return statKeys.reduce((sum,key)=>sum+statDelta(it,key),0)}
function deltaClass(value){return value>0?'stat-better':value<0?'stat-worse':'stat-same'}
function signed(value){return value>0?'+'+value:String(value)}
function itemStats(it,compare=false){return `<div class="item-stats">${[['health','Здоровье'],['str','Сила'],['armorStat','Броня'],['agi','Ловкость']].map(([key,label])=>`<small>${label}: <strong class="${compare?deltaClass(statDelta(it,key)):''}">+${it.stats[key]}</strong> <span>(${it.quality[key]}%)</span></small>`).join('')}</div>`}
function itemRarity(it){return rarities[it.rarity]||rarities[0]}
function dustForItem(it){return Math.round(25*1.1**Math.max(0,Math.min(5,Number(it.rarity)||0)))}
function bagDust(){return s.bag.reduce((sum,it)=>sum+dustForItem(it),0)}
function addSilver(amount){const total=s.silver+amount;s.gold+=Math.floor(total/100);s.silver=total%100}
function resourceIcon(name){return `<span class="resource-icon resource-${name}" aria-hidden="true"></span>`}
function potionCooldown(){return Math.max(0,Math.ceil(((Number(s.potionReadyAt)||0)-Date.now())/1000))}
function canDrinkPotion(){return s.potions>0&&s.hp<maxhp()&&potionCooldown()===0}
function potionLabel(inBattle){return inBattle?'Зелье · '+s.potions:'Выпить'}
function drinkPotion(){if(!canDrinkPotion())return 0;const heal=Math.min(Math.ceil(maxhp()*.5),maxhp()-s.hp);s.potions--;s.hp+=heal;s.potionReadyAt=Date.now()+(75-5*skillRank('alchemy'))*1000;return heal}
function applyRegen(){const now=Date.now();if(s.hp>=maxhp()){s.regenAt=now;return}const last=Number(s.regenAt)||now,seconds=Math.max(0,Math.floor((now-last)/1000));if(seconds){s.hp=Math.min(maxhp(),s.hp+seconds);s.regenAt=s.hp>=maxhp()?now:last+seconds*1000}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));storageOK=true}catch{storageOK=false}}
function downloadSave(){save();if(!storageOK){notice='Не удалось сохранить персонажа в этом браузере.';render();return}const data=new Blob([JSON.stringify({game:'pogranichye',version:1,state:s},null,2)],{type:'application/json'});const url=URL.createObjectURL(data);const link=document.createElement('a');link.href=url;link.download='pogranichye-save.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function importSave(file){try{if(!file||file.size>1024*1024)throw Error('Файл сохранения слишком большой.');const data=JSON.parse(await file.text());const state=data?.game==='pogranichye'?data.state:data;if(!state||!Number.isInteger(state.level)||state.level<1||!Array.isArray(state.bag)||!Number.isFinite(state.hp)||!Number.isFinite(state.xp)||!['health','str','armorStat','agi'].every(key=>Number.isFinite(state[key])&&state[key]>=10))throw Error('Это не сохранение Пограничья.');s={...fresh(),...state,battle:null};normalizeSave();s.hp=Math.max(0,Math.min(s.hp,maxhp()));save();profilePage='settings';notice='Персонаж восстановлен.';render()}catch(error){notice=error.message;render()}}
function setSession(value){authSession=value;try{if(value)localStorage.setItem(AUTH_KEY,JSON.stringify(value));else localStorage.removeItem(AUTH_KEY)}catch{storageOK=false}}
async function cloudRequest(path,options={}){if(!cloudConfig)throw Error('База данных ещё не подключена');const {method='GET',body,token=authSession?.access_token,prefer}=options;const headers={'apikey':cloudConfig.anonKey,'Content-Type':'application/json'};if(token&&token!==cloudConfig.anonKey)headers.Authorization=`Bearer ${token}`;if(prefer)headers.Prefer=prefer;const response=await fetch(`${cloudConfig.url.replace(/\/$/,'')}${path}`,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});const result=await response.json().catch(()=>null);if(!response.ok)throw Error(result?.msg||result?.message||result?.error_description||'Ошибка сервера');return result}
async function validSession(){if(!authSession)return null;if(authSession.expires_at&&authSession.expires_at>Date.now()/1000+60)return authSession;try{const next=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:authSession.refresh_token},token:cloudConfig.anonKey});setSession(next);return next}catch{setSession(null);throw Error('Сессия истекла. Войдите снова.')}}
async function saveCloud(){if(!authSession)return;const session=await validSession();await cloudRequest('/rest/v1/game_saves?on_conflict=user_id',{method:'POST',body:{user_id:session.user.id,state:s},prefer:'resolution=merge-duplicates',token:session.access_token})}
function queueCloudSave(){if(!authSession)return;cloudQueue=cloudQueue.catch(()=>{}).then(()=>saveCloud()).catch(error=>{notice=`Облачное сохранение: ${error.message}`;render()})}
async function loadCloud(){const session=await validSession();const rows=await cloudRequest(`/rest/v1/game_saves?user_id=eq.${encodeURIComponent(session.user.id)}&select=state`,{token:session.access_token});if(rows.length){s={...fresh(),...rows[0].state};if(s.battle?.loot){s.gold+=s.battle.loot;delete s.battle.loot}if(s.battle){s.battle.location=Number.isInteger(s.battle.location)?s.battle.location:0;s.battle.lastAttackAt=Date.now()-3000;s.battle.nextBiteAt=Date.now()+3000}normalizeSave();render()}else await saveCloud()}
async function loadMail(){if(!authSession){mailMessages=[];mailLoading=false;render();return}mailLoading=true;render();try{const session=await validSession();mailMessages=await cloudRequest('/rest/v1/mail_messages?select=id,subject,body,created_at,read_at&order=created_at.desc',{token:session.access_token})||[]}catch(error){authMessage=error.message}finally{mailLoading=false;render()}}
async function submitAuth(form){const email=form.elements.email.value.trim(),password=form.elements.password.value;authMessage='';try{const signup=authMode==='register';const result=await cloudRequest(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},token:cloudConfig.anonKey});if(!result.access_token){authMessage='Подтвердите адрес электронной почты, затем войдите.';render();return}setSession(result);await loadCloud();profilePage='overview';notice='Вход выполнен.';render()}catch(error){authMessage=error.message;render()}}
async function logout(){if(!authSession){profilePage='auth';render();return}try{await cloudQueue;await saveCloud();await cloudRequest('/auth/v1/logout',{method:'POST'});setSession(null);s=fresh();mailMessages=[];try{localStorage.removeItem(KEY)}catch{}profilePage='auth';tab='hero';authMessage='Вы вышли из аккаунта.';render()}catch(error){authMessage=error.message;profilePage='settings';render()}}

function button(text,action,disabled=false,cls=''){return `<button class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`}
function meter(value,max,cls=''){return `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,value/max*100))}%"></i></div>`}
function render(){applyRegen();save();document.getElementById('current-location').textContent=tab==='journey'&&s.battle?(s.battle.quest==='firstPath'?'Таверна · Первый путь':locations[s.battle.location||0].name):(tab==='hero'?({overview:'Профиль',gear:'Снаряжение',bag:'Сумка',skills:'Умения',mail:'Почта',stats:'Статистика',settings:'Настройки',auth:'Регистрация'}[profilePage]||'Профиль'):({arena:'Арена',main:'Главная',journey:'Окрестности',town:'Таверна',market:'Торговая площадь',forge:'Кузнец'}[tab]||'Главная'));const hpPercent=Math.round(s.hp/maxhp()*100),xpPercent=Math.round(s.xp/need()*100);document.getElementById('top-vitals').innerHTML=`<div class="top-meter hp-meter" role="progressbar" aria-label="Здоровье" aria-valuenow="${s.hp}" aria-valuemin="0" aria-valuemax="${maxhp()}"><span class="top-fill" style="width:${hpPercent}%"></span><span class="top-meter-text">♥ ${s.hp} / ${maxhp()}</span></div><div class="top-meter exp-meter" role="progressbar" aria-label="Опыт уровня" aria-valuenow="${s.xp}" aria-valuemin="0" aria-valuemax="${need()}"><span class="top-fill" style="width:${xpPercent}%"></span><span class="top-meter-text">ОПЫТ ${xpPercent}%</span></div>`;document.getElementById('nav').innerHTML=[['main','⌂','На главную'],['hero','♙','Герой'],['town','◇','Дом']].map(([id,icon,name])=>button(`${icon} ${name}`,'tab:'+id,false,tab===id?'active':'')).join('');document.getElementById('app').innerHTML=(['main','hero','journey','town','market','forge','arena'].includes(tab))?`${notice?`<div class="notice" role="status">${escapeHtml(notice)}</div>`:''}${!storageOK?'<div class="notice">Браузер не позволяет сохранить прогресс. Не закрывайте страницу.</div>':''}<div class="layout ${tab==='main'?'main-layout':'hero-layout'}"><section>${content()}</section></div>`:`<div class="intro"><div><div class="eyebrow">Хроники Вороньего брода</div><h1>${{main:'Выберите свой путь',hero:'Профиль героя',journey:'За пределами стен',town:'Вороний брод'}[tab]}</h1><span class="muted">${s.boss?'В крепости снова поднят королевский флаг.':'На краю королевства каждый меч имеет значение.'}</span></div><span class="tag">Глава I · Пограничье</span></div>${notice?`<div class="notice" role="status">${escapeHtml(notice)}</div>`:''}${!storageOK?'<div class="notice">Браузер не позволяет сохранить прогресс. Не закрывайте страницу.</div>':''}<div class="layout ${tab==='hero'?'hero-layout':tab==='main'?'main-layout':''}"><aside class="sidebar"><div class="card"><div class="profile"><div class="crest">♜</div><h2>Странник</h2><p class="muted">${s.level<4?'Начинающий наёмник':'Защитник пограничья'} · ${s.level} уровень</p></div><div class="row"><small>Здоровье</small><span>${s.hp} / ${maxhp()}</span></div>${meter(s.hp,maxhp())}<div class="row xp-label"><small>Опыт · уровень ${s.level}</small><small>${s.xp} / ${need()}</small></div>${meter(s.xp,need(),'xp')}<div class="details"><div class="row stat"><span>Атака</span><b>${attack()}</b></div><div class="row stat"><span>Защита</span><b>${defense()}</b></div><div class="row stat"><span>Победы</span><b>${s.kills}</b></div><p class="hint">Прогресс сохраняется в этом браузере автоматически.</p></div></div></aside><section>${content()}</section></div>`}
function content(){if(tab==='arena')return arenaScreen();if(tab==='main')return mainScreen();if(s.battle&&tab==='journey')return battleView();if(tab==='journey')return `<div class="arena-locations">${locations.map((location,i)=>`<div class="card arena-entry"><h2>${location.name}</h2>${button(s.level<location.min?'С '+location.min+' уровня':'Войти','start:'+i,s.hp<=0||s.level<location.min,'primary full-button')}</div>`).join('')}</div>`;
if(tab==='town')return tavernContent();
if(tab==='hero')return profileContent();
if(tab==='market')return `<div class="card market-list">${button('Кузнец','tab:forge')}${['Ювелир','Рынок','Обменник'].map(name=>`<button disabled>${name}</button>`).join('')}</div>`;
if(tab==='forge')return forgeScreen();
return tavernLegacy()}
function tavernLegacy(){return `<div class="card"><h2>Безопасные дороги</h2><div class="row"><span>Победы: ${Math.min(s.kills,5)} / 5</span><span class="coin">50 сер.</span></div>${meter(Math.min(s.kills,5),5)}${button(s.claimed?'Награда получена':'Забрать награду','claim',s.kills<5||s.claimed,'primary')}</div>`}
function mainScreen(){return `<div class="main-choices"><button class="main-choice pvp-entry" data-action="tab:arena"><span class="choice-icon">${icon('sword')}</span><span class="choice-copy"><strong>Арена</strong><small>Лиги · поединки · награды</small></span></button><button class="main-choice" data-action="tab:journey"><span class="choice-icon">${icon('sword')}</span><span class="choice-copy"><strong>${s.battle?'Вернуться в бой':'Окрестности'}</strong></span></button><button class="main-choice" data-action="tab:town"><span class="choice-icon">${icon('potion')}</span><span class="choice-copy"><strong>Таверна</strong></span></button><button class="main-choice" data-action="tab:market"><span class="choice-icon">${icon('ring')}</span><span class="choice-copy"><strong>Торговая площадь</strong></span></button></div>`}
const firstPathFoes=[{name:'Пьянчуга Карл',hp:40,str:25,armorStat:25,agi:25},{name:'Пьянчуга Аргос',hp:50,str:35,armorStat:35,agi:35}];
function firstPathEnemy(index){const a=firstPathFoes[index];return {...a,kind:2,maxHp:a.hp,atk:a.str,xp:0}}
const tavernQuests=[{id:'firstPath',title:'Первый путь',level:1,screen:tavernQuest,status:()=>({active:'В процессе',ready:'Получить награду',done:'Выполнено'}[s.firstPath]||'')},{id:'safeRoads',title:'Безопасные дороги',level:1,screen:tavernLegacy,status:()=>s.claimed?'Выполнено':s.kills>=5?'Получить награду':''}];
function tavernContent(){const quest=tavernQuests.find(q=>q.id===tavernPage);if(quest)return `<div class="tavern-shell tavern-dialogue">${button('← К списку заданий','tavern:list',false,'profile-back')}${quest.screen()}</div>`;return `<div class="tavern-shell"><div class="tavern-hero"><img class="tavern-art" src="tavern.webp" width="1536" height="1024" alt="Тёплый зал средневековой таверны: камин, свечи и бармен Лайт за деревянной стойкой" fetchpriority="high"><div class="tavern-welcome"><div class="tavern-kicker">Вороний брод · место встречи</div><h2>Таверна</h2><p>У очага всегда найдётся место.<br>А у стойки — работа для твоего меча.</p></div></div><div class="tavern-strip"><span><i class="tavern-dot" aria-hidden="true"></i>Огонь в очаге. Слухи за столами.</span><b>Хозяин · Лайт</b></div><div class="tavern-board"><div class="tavern-board-head"><h3>Доска заданий</h3><small>Выбери свою историю</small></div><div class="tavern-quests">${tavernQuests.map(q=>{const status=q.status();return `<button class="tavern-quest" data-action="tavern:${q.id}" ${s.level<q.level?'disabled':''}><span class="quest-seal" aria-hidden="true">${q.id==='firstPath'?'Ⅰ':'⚔'}</span><span class="quest-copy"><strong>${q.title} <small>· ${q.level} ур.</small></strong><small>${q.id==='firstPath'?'Сюжетное задание · Бармен Лайт':'Поручение · окрестности Вороньего брода'}</small></span>${status?`<span class="quest-status">${status}</span>`:''}<span class="quest-chevron" aria-hidden="true">›</span></button>`}).join('')}</div></div><p class="tavern-footnote">Каждый путь начинается с разговора.</p></div>`}
function tavernQuest(){const state=s.firstPath;let body='';if(state==='done')body='<p>Спасибо за помощь, путник. В таверне снова спокойно.</p><span class="tag">Задание выполнено · награда получена</span>';else if(state==='ready')body=`<p>Спасибо, удружил. Не так много, но как и обещал.</p><p class="coin">Награда: 100 опыта и 3 зелья здоровья</p>${button('Получить награду','firstPath:claim',false,'primary')}`;else if(state==='active')body=`<p>Дебоширы всё ещё здесь. Поможешь их разнять?</p>${button(s.battle?.quest==='firstPath'?'Продолжить бой':'Разнять дебоширов','firstPath:accept',s.hp<=0,'primary')}`;else if(tavernDialogue)body=`<p>Помоги разнять вон тех двух дебоширов, а я не обижу!</p><p class="coin">Награда: 100 опыта и 3 зелья здоровья</p><div class="actions">${button('Принять','firstPath:accept',s.level<1||s.hp<=0,'primary')}${button('Отказаться','firstPath:decline')}</div>`;else body=`<p>Привет, путник, я вижу, ты умеешь пользоваться мечом?</p>${button('Умею','firstPath:talk',s.level<1)}`;return `<div class="card"><div class="eyebrow">Сюжетное задание · доступно с 1 уровня</div><h2>Первый путь</h2><h3>Бармен Лайт</h3>${body}</div>`}
function gainExperience(amount){s.xp+=amount;while(s.xp>=need()){s.xp-=need();s.level++;for(const stat of statKeys)s[stat]+=5;s.hp=maxhp()}}
function firstPathAction(action){if(action==='talk'){tavernDialogue=true;return}if(action==='decline'){tavernDialogue=false;return}if(action==='claim'&&s.firstPath==='ready'){s.firstPath='done';gainExperience(100);s.potions+=3;notice='Получено: 100 опыта и 3 зелья здоровья.';return}if(action==='accept'&&['new','active'].includes(s.firstPath)&&s.level>=1&&s.hp>0){s.firstPath='active';s.battle={quest:'firstPath',location:0,wave:1,wins:0,enemy:firstPathEnemy(0),turn:1,cooldown:0,log:['Вы подходите к двум дебоширам.'],lastAttackAt:Date.now()-3000,nextBiteAt:Date.now()+3000,guarding:false};tab='journey'}}
function forgeScreen(){const equipped=slotSpecs.map(([slot])=>s.equipment[slot]?[s.equipment[slot],slot]:null).filter(Boolean),bag=s.bag.map((it,i)=>[it,i]);if(forgeSource==='equipped'&&!equipped.length&&bag.length)forgeSource='bag';const items=forgeSource==='equipped'?equipped:bag;if(!items.some(([,id])=>String(id)===String(forgeSelection)))forgeSelection=items[0]?.[1]??null;const selected=items.find(([,id])=>String(id)===String(forgeSelection))?.[0],level=selected?.sharpen||0,done=level>=15;return `${button('← Торговая площадь','tab:market',false,'profile-back')}<div class="card profile-section"><div class="forge-top"><div class="forge-balance">${resourceIcon('dust')}Пыль: ${s.dust}</div></div><div class="forge-tabs">${button('Надето · '+equipped.length,'forgeSource:equipped',false,forgeSource==='equipped'?'active':'')}${button('Сумка · '+bag.length,'forgeSource:bag',false,forgeSource==='bag'?'active':'')}</div><div class="forge-list">${items.map(([it,id])=>`<button class="forge-item rarity-${itemRarity(it).className} ${String(id)===String(forgeSelection)?'active':''}" data-action="forgeSelect:${id}"><span class="inventory-icon">${itemIcon(it)}</span><span class="forge-item-copy"><b>${itemName(it)}</b><small class="item-rarity">${itemRarity(it).name}</small></span></button>`).join('')}${items.length?'':'<div class="empty-bag">Нет вещей</div>'}</div>${selected?`<div class="forge-detail rarity-${itemRarity(selected).className}"><div class="forge-detail-head"><span class="inventory-icon">${itemIcon(selected)}</span><div><b>${itemName(selected)}</b><small class="item-rarity">${itemRarity(selected).name}</small></div></div><div class="forge-stats">${[['health','Здоровье'],['str','Сила'],['armorStat','Броня'],['agi','Ловкость']].map(([key,label])=>{const current=selected.stats[key],next=done?current:Math.round(selected.baseStats[key]*(1+(level+1)*.1));return `<div class="forge-stat"><span>${label}</span><span>${current}</span><strong class="${done?'':'stat-better'}">${done?'—':'→ '+next}</strong></div>`}).join('')}</div><div class="forge-offer"><span>${done?'Максимум +15':'Шанс '+sharpenChances[level]+'%'}</span><span>${done?'':sharpenCost(level)+' пыли'}</span></div>${button(done?'Максимальная заточка':'Заточить до +'+(level+1),'sharpen:'+forgeSource+':'+forgeSelection,done||s.dust<sharpenCost(level),'primary')}</div>`:''}</div>`}
function icon(name){return `<span class="game-icon icon-${name}" aria-hidden="true"></span>`}

function equipmentSlot(slot){const spec=slotSpecs.find(x=>x[0]===slot),it=s.equipment?.[slot];return `<div class="equipment-slot ${it?'is-equipped rarity-'+itemRarity(it).className:''}" title="${spec[1]}${it?' · '+itemName(it):' · Пусто'}" aria-label="${spec[1]}${it?' · '+itemName(it):' · Пусто'}">${it?itemIcon(it)+equipmentSharpen(it):icon(slot)}</div>`}
function profileContent(){if(profilePage==='overview')return heroProfile();const back=button('← Профиль','profile:overview',false,'profile-back');const pages={gear:profileGear,bag:profileBag,skills:profileSkills,mail:profileMail,stats:profileStats,settings:profileSettings,auth:profileAuth};return back+(pages[profilePage]||heroProfile)()}

function heroProfile(){const percent=Math.round(s.xp/need()*100);return `<div class="equipment-card card"><div class="equipment-heading"><h2>Странник <span>· ${s.level} уровень</span></h2></div><div class="equipment-display"><div class="slot-column">${['helmet','shoulder','gauntlet','greaves','armor'].map(equipmentSlot).join('')}</div><div class="character-frame"><img src="knight.webp" alt="Рыцарь в доспехах" loading="eager"></div><div class="slot-column">${['necklace','cloak','ring','sword','boots'].map(equipmentSlot).join('')}</div></div></div><div class="card profile-section parameter-card"><div class="parameter-row">${icon('heart')}<span>Здоровье:</span><b>${totalStat('health')}</b><small>(${maxhp()}, +1/сек.)</small></div><div class="parameter-row">${icon('fist')}<span>Сила:</span><b>${totalStat('str')}</b></div><div class="parameter-row">${icon('shield')}<span>Броня:</span><b>${totalStat('armorStat')}</b><small>(${armorPercent().toFixed(2)}%)</small></div><div class="parameter-row">${icon('feather')}<span>Ловкость:</span><b>${totalStat('agi')}</b><small>(${critPercent().toFixed(2)}% шанс крита)</small></div><div class="parameter-total"><span>Сумма параметров:</span><b>${statKeys.reduce((sum,key)=>sum+totalStat(key),0)}</b></div></div><div class="profile-links card">${profileLink('Снаряжение','gear')}${profileLink('Сумка','bag')}${profileLink('Умения','skills')}${profileLink('Почта','mail')}</div><div class="profile-experience card">Опыт: ${s.xp}/${need()} (${percent}%)</div><div class="card profile-currency"><div class="currency-grid"><div class="currency-chip">${resourceIcon('gold')}<span>Золото</span><b>${s.gold}</b></div><div class="currency-chip">${resourceIcon('silver')}<span>Серебро</span><b>${s.silver}</b></div><div class="currency-chip">${resourceIcon('soul')}<span>Души</span><b>${s.souls||0}</b></div><div class="currency-chip">${resourceIcon('dust')}<span>Пыль</span><b>${s.dust||0}</b></div><div class="currency-chip currency-potion">${resourceIcon('potion')}<span>Зелья</span><b>${s.potions}</b></div></div><div class="currency-rate">1 зол. = 100 сер.</div></div><div class="card premium-line">Премиум: в разработке</div><div class="profile-links card">${profileLink('Статистика','stats')}${profileLink('Настройки','settings')}</div>`}
function profileGear(){return `<div class="card profile-section"><h2>Снаряжение</h2><div class="gear-grid">${slotSpecs.map(([slot,label])=>{const it=s.equipment?.[slot],rarity=it?itemRarity(it):null;return `<div class="gear-slot ${it?'is-equipped rarity-'+rarity.className:'is-empty'}"><span class="slot-icon">${it?itemIcon(it)+equipmentSharpen(it):icon(slot)}</span><div><small>${label.toUpperCase()}</small><b>${it?itemName(it):'Пусто'}</b>${it?`<small class="item-rarity">${rarity.name}</small>${itemStats(it)}${button('Снять','unequip:'+slot,false,'unequip-button')}`:''}</div></div>`}).join('')}</div></div>`}
function profileBag(){return `<div class="card profile-section"><h2>Сумка</h2>${s.bag.map((it,i)=>{const rarity=itemRarity(it),difference=itemDelta(it);return `<div class="inventory-row rarity-${rarity.className}"><span class="inventory-icon">${itemIcon(it)}</span><div class="inventory-text"><b>${itemName(it)} <span class="${deltaClass(difference)}">(${signed(difference)})</span></b><small class="item-rarity">${rarity.name}</small>${itemStats(it,true)}</div><div class="inventory-actions">${button('Надеть','equip:'+i,!!s.battle||s.level<setSpecs[it.set].level,'inventory-action')}${button('Разобрать · +'+dustForItem(it)+' пыли','salvage:'+i,!!s.battle,'subtle-action')}</div></div>`}).join('')}${!s.bag.length?'<div class="empty-bag">Пусто</div>':''}${button(s.bag.length?'Разобрать всё · +'+bagDust()+' пыли':'Разобрать всё','salvageAll',!s.bag.length||!!s.battle,'full-button')}</div>`}
function profileSkills(){return `<div class="card profile-section"><div class="skill-points"><span>Очки умений</span><b>${freeSkillPoints()}</b></div>${skillSpecs.map(skill=>{const rank=skillRank(skill.id);return `<div class="skill-upgrade">${icon(skill.icon)}<div class="skill-copy"><b>${skill.name}</b><small>${skill.effect(rank)}</small><em>${rank} / 10</em></div>${button(rank>=10?'Макс.':'Улучшить','skill:'+skill.id,rank>=10||freeSkillPoints()===0)}</div>`}).join('')}</div>`}
function profileMail(){return `<div class="card profile-section"><h2>Почта</h2>${mailLoading?'<div class="empty-bag">Загрузка…</div>':mailMessages.length?mailMessages.map(m=>`<article class="mail-item"><b>${escapeHtml(m.subject)}</b><p>${escapeHtml(m.body)}</p></article>`).join(''):'<div class="empty-bag">Нет писем</div>'}</div>`}
function profileStats(){return `<div class="card profile-section"><h2>Статистика</h2><div class="stats-content"><span>Победы</span><strong>${s.kills}</strong></div><div class="stats-content"><span>Побеждённые главари</span><strong>${s.boss}</strong></div></div>`}
function profileSettings(){return `<div class="card profile-section"><h2>Настройки</h2>${authSession?`<div class="account-email">${escapeHtml(authSession.user.email)}</div>`:'<div class="account-email">Тестовый персонаж · сохранение в этом браузере</div>'}${button('Скачать сохранение','downloadSave',false,'full-button')}<label class="full-button save-upload">Загрузить сохранение<input id="save-file" type="file" accept=".json,application/json"></label>${cloudConfig&&!authSession?button('Регистрация и вход','profile:auth',false,'full-button'):''}${authSession?button('Выйти','logout',false,'full-button'):''}</div>`}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function profileAuth(){return `<div class="card profile-section"><h2>${authMode==='register'?'Регистрация':'Вход'}</h2>${authMessage?`<div class="notice" role="status">${escapeHtml(authMessage)}</div>`:''}${cloudConfig?'':'<div class="notice">База данных ещё не подключена.</div>'}<form id="auth-form" class="auth-form"><label>Почта<input name="email" type="email" autocomplete="email" required></label><label>Пароль<input name="password" type="password" minlength="8" autocomplete="${authMode==='register'?'new-password':'current-password'}" required></label><button type="submit" class="primary" ${cloudConfig?'':'disabled'}>${authMode==='register'?'Зарегистрироваться':'Войти'}</button></form>${button(authMode==='register'?'Уже есть аккаунт? Войти':'Создать аккаунт','authMode:'+(authMode==='register'?'signin':'register'),false,'auth-switch')}</div>`}
const patterns=[
 [{name:'Укус',detail:'Обычная атака.',power:1},{name:'Прыжок',detail:'Сильный удар.',power:1.7},{name:'Кружит рядом',detail:'Слабая атака.',power:.5}],
 [{name:'Разгоняется',detail:'Сильный удар.',power:1.8},{name:'Удар клыком',detail:'Часть брони не действует.',power:1.1,pierce:.5},{name:'Переводит дух',detail:'Слабая атака.',power:.45}],
 [{name:'Поднимает щит',detail:'Получит меньше урона.',power:.6,block:.4},{name:'Удар клинком',detail:'Обычная атака.',power:1},{name:'Выпад',detail:'Часть брони не действует.',power:1.2,pierce:.5}],
 [{name:'Цепляется когтями',detail:'Обычная атака.',power:1},{name:'Восстанавливается',detail:'Лечится перед ударом.',power:.55,heal:.12},{name:'Рывок',detail:'Сильный удар.',power:1.65}],
 [{name:'Прикрывается',detail:'Получит меньше урона.',power:.7,block:.5},{name:'Точный выпад',detail:'Часть брони не действует.',power:1.25,pierce:.65},{name:'Замах',detail:'Сильный удар.',power:1.8}],
 [{name:'Тяжёлый замах',detail:'Очень сильный удар.',power:2},{name:'Глухая защита',detail:'Получит меньше урона.',power:.7,block:.4},{name:'Пролом',detail:'Часть брони не действует.',power:1.5,pierce:.7}]
];
function intent(b){const moves=patterns[b.enemy.kind]||patterns[0];return moves[(b.turn-1)%moves.length]}
function strikePercent(elapsed){return Math.max(1,Math.min(100,1+(Math.max(100,elapsed)-100)*99/2900))}
function battleView(){const b=s.battle,a=b.enemy;return `<div class="card arena-battle"><div class="eyebrow">${b.quest==='firstPath'?'ТАВЕРНА · ПЕРВЫЙ ПУТЬ · '+(b.wins+1)+'/2':locations[b.location||0].name.toUpperCase()}</div><div class="arena-enemy"><span class="enemy-portrait" style="--ex:${a.kind%3*50}%;--ey:${a.kind<3?0:100}%" role="img" aria-label="${a.name}"></span><h2>${a.name}</h2></div><div class="row"><small>Здоровье противника</small><span>${a.hp} / ${a.maxHp}</span></div>${meter(a.hp,a.maxHp)}<div class="intent"><strong>${intent(b).name}</strong> · ${intent(b).detail}</div>${button('Атаковать · '+Math.round(strikePercent(Date.now()-b.lastAttackAt))+'%','fight:hit',false,'primary arena-attack')}<div class="actions arena-tools">${button('Защита','fight:guard')}${button(b.cooldown?'Выпад · '+b.cooldown:'Мощный выпад','fight:skill',b.cooldown>0)}${button(potionLabel(true),'fight:potion',!canDrinkPotion(),'potion-use')}</div></div><div class="card"><div class="log" aria-live="polite">${b.log.slice(-4).map(l=>typeof l==='string'?`<p>${escapeHtml(l)}</p>`:`<p class="loot rarity-${l.rarity}">${escapeHtml(l.text)}</p>`).join('')}</div>${button('Покинуть локацию','flee',false,'full-button')}</div>`}
function enemyTick(){const b=s.battle;if(!b)return;const now=Date.now();let changed=false;while(s.battle&&now>=b.nextBiteAt){const a=b.enemy,move=intent(b),effectiveArmor=defense()*(1-(move.pierce||0)),reduction=effectiveArmor/(effectiveArmor+23.21),damage=Math.max(1,Math.round(a.atk*(b.quest==='firstPath'&&Math.random()*100<Math.min(50,a.agi*.5)?1.5:1)*(1-reduction)*move.power*(1-.03*skillRank('ward'))*(b.guarding?.3:1)));if(move.heal){const restored=Math.min(a.maxHp-a.hp,Math.ceil(a.maxHp*move.heal));a.hp+=restored;if(restored)b.log.push(`${a.name}: +${restored} здоровья.`)}s.hp=Math.max(0,s.hp-damage);b.log.push(`${a.name}: ${damage} урона вам.`);b.guarding=false;b.nextBiteAt+=3000;b.turn++;changed=true;if(s.hp===0){s.battle=null;notice='Поражение. Восстановите здоровье.';tab='town'}}if(changed){queueCloudSave();render()}}
function act(action){const [type,arg,detail]=action.split(':');notice='';if(type==='downloadSave'){downloadSave();return}if(type==='tavern'){tavernPage=tavernQuests.some(q=>q.id===arg)?arg:null;tavernDialogue=false;tab='town';render();return}if(type==='tab'){tab=arg;if(arg==='town')tavernPage=null;if(arg==='hero')profilePage='overview';render();return}if(type==='forgeSource'){forgeSource=arg;forgeSelection=null;render();return}if(type==='forgeSelect'){forgeSelection=arg;render();return}if(type==='profile'){profilePage=arg;tab='hero';render();if(arg==='mail')loadMail();return}if(type==='authMode'){authMode=arg;authMessage='';render();return}if(type==='logout'){logout();return}if(type==='firstPath'&&arg==='accept'&&s.battle?.quest==='firstPath'){tab='journey';render();return}if(type.startsWith('arena')){if(s.battle){notice='Сначала заверши бой в окрестностях.';render();return}arenaAction(type,arg);queueCloudSave();render();return}if(s.battle&&!['fight','flee'].includes(type)){notice='Завершите бой перед этим действием.';render();return}
if(s.arena?.duel){notice='Заверши поединок на арене.';tab='arena';render();return}
if(type==='firstPath')firstPathAction(arg);
if(type==='sharpen'){const it=arg==='equipped'?s.equipment[detail]:arg==='bag'?s.bag[Number(detail)]:null;if(it){const oldMax=maxhp(),level=it.sharpen||0,cost=sharpenCost(level);if(level<15&&s.dust>=cost){const success=sharpenItem(it);if(success&&arg==='equipped')s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)));notice=success?`${itemName(it)}: заточка успешна.`:`Заточка не удалась. Потрачено ${cost} пыли.`}}}
if(type==='skill'&&skillSpecs.some(skill=>skill.id===arg)&&skillRank(arg)<10&&freeSkillPoints()>0){s.skills[arg]=skillRank(arg)+1;notice='Умение улучшено.'}
if(type==='start'&&s.hp>0){const locationId=Number(arg||0);if(!locations[locationId]||s.level<locations[locationId].min){render();return}s.battle={location:locationId,wave:1,wins:0,enemy:nextFoe(1,-1,locationId),turn:1,cooldown:0,log:[],lastAttackAt:Date.now()-3000,nextBiteAt:Date.now()+3000,guarding:false};tab='journey'}
if(type==='fight')fight(arg);
if(type==='flee'&&s.battle){tab=s.battle.quest==='firstPath'?'town':'journey';s.battle=null}
if(type==='potion'&&!s.battle)drinkPotion()
if(type==='unequip'&&s.equipment[arg]){const oldMax=maxhp();s.bag.push(s.equipment[arg]);delete s.equipment[arg];s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)))}
if(type==='salvageAll'&&s.bag.length){const count=s.bag.length,dust=bagDust();s.dust=(s.dust||0)+dust;s.bag=[];notice=`Разобрано ${count} вещей. +${dust} пыли.`}
if(type==='claim'&&s.kills>=5&&!s.claimed){s.claimed=true;addSilver(50);notice='Получено 50 серебра.'}
if(type==='salvage'&&s.bag[Number(arg)]){const item=s.bag.splice(Number(arg),1)[0],dust=dustForItem(item);s.dust=(s.dust||0)+dust;notice=`+${dust} пыли.`}
if(type==='equip'&&s.bag[Number(arg)]){const it=s.bag[Number(arg)];if(s.level<setSpecs[it.set].level){notice=`Требуется ${setSpecs[it.set].level} уровень.`}else{const oldMax=maxhp();s.bag.splice(Number(arg),1);const prev=s.equipment[it.slot];s.equipment[it.slot]=it;if(prev)s.bag.push(prev);s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)));notice='Снаряжение надето.'}}
queueCloudSave();render()}
function fight(move){enemyTick();const b=s.battle;if(!b)return;const a=b.enemy,enemyMove=intent(b);if(!['hit','guard','skill','potion'].includes(move)||move==='skill'&&b.cooldown>0||move==='potion'&&!canDrinkPotion())return;
if(move==='potion')drinkPotion();else{const percent=strikePercent(Date.now()-b.lastAttackAt);b.lastAttackAt=Date.now();const critical=Math.random()*100<critPercent();const raw=attack()*(move==='skill'?2:move==='guard'?.45:1)*(critical?1.5:1)*(1+.05*skillRank('assault'))*percent/100;const damage=Math.max(1,Math.round(raw*(enemyMove.block??1)*(b.quest==='firstPath'?23.21/(23.21+a.armorStat):1)));a.hp=Math.max(0,a.hp-damage);b.log.push(`${move==='skill'?'Мощный выпад':move==='guard'?'Осторожный удар':'Ваш удар'}: ${damage} урона (${Math.round(percent)}%)${critical?' · крит':''}.`);if(move==='guard')b.guarding=true}
if(a.hp<=0&&b.quest==='firstPath'){s.kills++;b.wins++;if(b.wins>=2){s.firstPath='ready';s.battle=null;tab='town';tavernPage='firstPath';notice='Дебоширы усмирены. Вернитесь к Бармену Лайту за наградой.'}else{b.wave++;b.enemy=firstPathEnemy(b.wins);b.turn=1;b.cooldown=0;b.guarding=false;b.lastAttackAt=Date.now()-3000;b.nextBiteAt=Date.now()+3000;b.log.push('Карл усмирён. В бой вступает Пьянчуга Аргос.')}return}
if(a.hp<=0){s.kills++;b.wins++;s.souls=(s.souls||0)+1;s.xp+=a.xp;if(a.kind===5)s.boss++;b.log.push(`+1 душа · +${a.xp} опыта.`);if(rollGearDrop()){const slot=slotSpecs[Math.floor(Math.random()*slotSpecs.length)][0],setId=locations[b.location||0].set,item=makeItem(slot,setId);s.bag.push(item);b.log.push({text:`Найдено: ${itemName(item)}.`,rarity:itemRarity(item).className})}if(Math.random()<.01){s.potions++;b.log.push('Найдено зелье здоровья.')}while(s.xp>=need()){s.xp-=need();s.level++;for(const stat of ['health','str','armorStat','agi'])s[stat]+=5;s.hp=maxhp();b.log.push(`Уровень ${s.level}: +5 к каждому параметру.`)}const previous=a.kind;b.wave++;b.enemy=nextFoe(b.wave,previous,b.location||0);b.turn=1;b.cooldown=0;b.guarding=false;b.nextBiteAt=Date.now()+3000;b.log.push(`Появляется ${b.enemy.name}.`);return}
b.cooldown=move==='skill'?2:Math.max(0,b.cooldown-1)}
const arenaStances={rush:{name:'Натиск',hint:'+20% урона, +15% входящего',out:1.2,in:1.15,beats:'counter'},guard:{name:'Защита',hint:'−15% урона, −25% входящего',out:.85,in:.75,beats:'rush'},counter:{name:'Контратака',hint:'Обычный урон · преимущество против защиты',out:1,in:1,beats:'guard'}};
const arenaLeagues=[{name:'Бронза',min:0,max:999,reward:20},{name:'Серебро',min:1000,max:1299,reward:40},{name:'Золото',min:1300,max:1699,reward:70},{name:'Алмаз',min:1700,max:2099,reward:110},{name:'Чемпион',min:2100,max:9999,reward:160}];
let arenaPage='opponents';
function arenaSeason(){return new Date().toISOString().slice(0,7)}
function arenaLeague(rating){return [...arenaLeagues].reverse().find(l=>rating>=l.min)||arenaLeagues[0]}
function normalizeArena(){if(!s.arena||typeof s.arena!=='object')s.arena={};const a=s.arena;a.rating=Math.max(0,Math.floor(Number.isFinite(Number(a.rating))?Number(a.rating):900));a.tokens=Math.max(0,Math.floor(Number(a.tokens)||0));a.wins=Math.max(0,Number(a.wins)||0);a.losses=Math.max(0,Number(a.losses)||0);a.stance=arenaStances[a.stance]?a.stance:'rush';a.history=Array.isArray(a.history)?a.history.slice(0,30):[];a.opponents=Array.isArray(a.opponents)?a.opponents:[];if(a.season&&a.season!==arenaSeason()){if(a.wins+a.losses>0){const reward=arenaLeague(a.rating).reward;a.tokens+=reward;a.seasonMessage='Прошлый сезон завершён: +'+reward+' жетонов.'}a.rating=900;a.wins=a.losses=0;a.duel=null;a.opponents=[]}a.season=arenaSeason()}
function arenaOpponents(){const a=s.arena;if(a.opponents.length===3)return;const names=['Ржавый Клык','Мира Тихая','Страж Борн','Северный Ворон','Искра','Рыцарь Седой','Лесной Шёпот','Торн'];const start=Math.floor(Math.random()*names.length);a.opponents=[.78,1,1.22].map((scale,i)=>({id:Date.now()+'-'+i,name:names[(start+i)%names.length],level:s.level,rating:Math.max(0,a.rating+[-90,15,110][i]),stance:['guard','rush','counter'][(start+i)%3],health:Math.max(5,Math.round(totalStat('health')*scale)),str:Math.max(5,Math.round(attack()*scale)),armorStat:Math.max(5,Math.round(defense()*scale)),agi:Math.max(5,Math.round(totalStat('agi')*scale))}));save()}
function arenaScreen(){normalizeArena();const a=s.arena;if(a.duel)return arenaDuelView();arenaOpponents();const league=arenaLeague(a.rating),next=arenaLeagues[arenaLeagues.indexOf(league)+1],progress=next?Math.min(100,Math.max(0,(a.rating-league.min)/(next.min-league.min)*100)):100;return `<div class="pvp-shell"><div class="pvp-hero"><div class="eyebrow">Испытание клинка · сезон ${a.season}</div><div class="row"><div><h2>Арена</h2><p>Выбирай соперника. Поднимайся в лиге.</p></div><div class="pvp-emblem" aria-hidden="true">⚔</div></div><div class="pvp-rank"><span>${league.name}</span><strong>${a.rating}</strong><small>рейтинг</small></div><div class="bar"><i style="width:${progress}%"></i></div><div class="row hint"><span>${next?'До лиги «'+next.name+'»: '+Math.max(0,next.min-a.rating):'Высшая лига'}</span><span>${a.wins} побед · ${a.losses} поражений</span></div></div><div class="pvp-demo">Пробная арена · тренировочные соперники. Рейтинг и сезон сохраняются у твоего персонажа. Общего рейтинга игроков пока нет.</div>${a.seasonMessage?`<div class="notice">${escapeHtml(a.seasonMessage)}</div>`:''}<div class="pvp-wallet"><span>Жетоны арены <b>◈ ${a.tokens}</b></span><small>Награда сезона: ${league.reward} жетонов · начислится при входе в следующем месяце, если были бои</small></div><div class="pvp-tabs">${[['opponents','Соперники'],['history','История'],['shop','Лавка']].map(([id,title])=>button(title,'arenaTab:'+id,false,arenaPage===id?'active':'')).join('')}</div>${arenaPage==='opponents'?arenaRoster():arenaPage==='history'?arenaHistory():arenaShop()}</div>`}
function arenaRoster(){const a=s.arena;return `<div class="card pvp-stance"><div class="row"><h3>Боевая стойка</h3><small>Твоя тактика</small></div><div class="pvp-stances">${Object.entries(arenaStances).map(([id,st])=>`<button class="${a.stance===id?'active':''}" data-action="arenaStance:${id}" aria-pressed="${a.stance===id}"><b>${st.name}</b><small>${st.hint}</small></button>`).join('')}</div><p class="hint">Защита сильнее натиска, натиск — контратаки, контратака — защиты. Преимущество даёт +15% урона.</p></div><div class="row pvp-section"><h3>Выбери противника</h3>${button('Другие соперники','arenaRefresh',false,'pvp-small')}</div><div class="pvp-roster">${a.opponents.map((o,i)=>{const reward=arenaWinRating(o);return `<div class="card pvp-opponent"><div class="row"><span class="pvp-avatar" aria-hidden="true">${['♜','♞','♝'][i]}</span><span class="pvp-enemy-copy"><b>${escapeHtml(o.name)}</b><small>${o.level} ур. · ${arenaLeague(o.rating).name} · ${o.rating}</small></span><span class="pvp-pill">${['Легче','Равный','Сильнее'][i]}</span></div><div class="pvp-mini-stats"><span>♥ ${o.health*5}</span><span>Сила ${o.str}</span><span>Броня ${o.armorStat}</span><span>Ловк. ${o.agi}</span></div><div class="row hint"><span>${arenaStances[o.stance].name}</span><span class="coin">+${reward} рейтинга · ◈ ${arenaTokens(o)}</span></div>${button('Вызвать на бой','arenaStart:'+i,!!s.battle,'primary full-button')}</div>`}).join('')}</div>${s.battle?'<p class="notice">Сначала заверши текущий бой в окрестностях.</p>':''}`}
function arenaWinRating(o){return Math.max(8,Math.min(40,Math.round(24+(o.rating-s.arena.rating)/12)))}
function arenaTokens(o){return o.rating>s.arena.rating+50?8:o.rating<s.arena.rating-50?4:6}
function arenaHistory(){return `<div class="card"><h3>Последние бои</h3>${s.arena.history.length?s.arena.history.map((h,i)=>`<div class="pvp-history"><div><b class="${h.win?'stat-better':'stat-worse'}">${h.win?'Победа':'Поражение'}</b><strong>${escapeHtml(h.enemy.name)}</strong><small>${new Date(h.at).toLocaleString('ru-RU')} · ${signed(h.delta)} рейтинга · ◈ +${h.tokens}</small></div>${button('Реванш','arenaRematch:'+i,!!s.battle,'pvp-small')}</div>`).join(''):'<div class="empty-bag">Здесь появятся результаты твоих поединков.</div>'}</div>`}
const arenaGoods=[{id:'potion',name:'Зелья здоровья ×3',copy:'Для путешествий и сражений за пределами арены.',cost:12},{id:'dust',name:'Пыль ×150',copy:'Материал для заточки экипировки у кузнеца.',cost:20},{id:'gear',name:'Редкий предмет',copy:'Случайная вещь доступного тебе комплекта. Редкость — редкая.',cost:60}];
function arenaShop(){return `<div class="card"><h3>Лавка арены</h3>${arenaGoods.map(g=>`<div class="pvp-history"><div><strong>${g.name}</strong><small>${g.copy}</small></div>${button('◈ '+g.cost,'arenaBuy:'+g.id,s.arena.tokens<g.cost,'pvp-small')}</div>`).join('')}</div>`}
function arenaStart(o){if(s.battle||s.arena.duel||!o)return;s.arena.duel={enemy:{...o},stance:s.arena.stance,hp:maxhp(),maxHp:maxhp(),enemyHp:o.health*5,enemyMax:o.health*5,turn:1,cooldown:0,log:['Поединок начался. Здоровье и зелья персонажа не расходуются.'],winRating:arenaWinRating(o),tokens:arenaTokens(o),stats:{str:attack(),armorStat:defense(),agi:totalStat('agi')}};tab='arena'}
function arenaDuelView(){const d=s.arena.duel;return `<div class="pvp-shell"><div class="card pvp-duel"><div class="eyebrow">Арена · тренировочный поединок · ход ${d.turn}</div><h2>${escapeHtml(d.enemy.name)}</h2><p class="hint">${arenaStances[d.enemy.stance].name} против твоей стойки «${arenaStances[d.stance].name}»</p><div class="row"><span>Соперник</span><b>${d.enemyHp} / ${d.enemyMax}</b></div>${meter(d.enemyHp,d.enemyMax)}<div class="row"><span>Ты</span><b>${d.hp} / ${d.maxHp}</b></div>${meter(d.hp,d.maxHp)}<div class="actions">${button('Удар','arenaMove:hit',false,'primary')}${button(d.cooldown?'Выпад · '+d.cooldown:'Мощный выпад','arenaMove:skill',d.cooldown>0)}${button('Защита','arenaMove:guard')}</div><p class="hint">После твоего действия отвечает соперник. Защита ослабляет его ответ на 65%.</p><div class="log" aria-live="polite">${d.log.slice(-6).map(l=>`<p>${escapeHtml(l)}</p>`).join('')}</div>${button('Сдаться','arenaMove:surrender',false,'full-button')}</div></div>`}
function arenaDamage(str,armor,agi,stance,targetStance,power=1){const st=arenaStances[stance],target=arenaStances[targetStance],crit=Math.random()*100<Math.min(50,agi*.5);return Math.max(1,Math.round(str*23.21/(armor+23.21)*st.out*target.in*(st.beats===targetStance?1.15:1)*power*(crit?1.5:1)))}
function arenaMove(move){const d=s.arena.duel;if(!d||!['hit','skill','guard','surrender'].includes(move)||move==='skill'&&d.cooldown>0)return;if(move==='surrender'){arenaFinish(false);return}const damage=arenaDamage(d.stats.str,d.enemy.armorStat,d.stats.agi,d.stance,d.enemy.stance,move==='skill'?1.8:move==='guard'?.45:1);d.enemyHp=Math.max(0,d.enemyHp-damage);d.log.push('Твой '+(move==='skill'?'мощный выпад':move==='guard'?'осторожный удар':'удар')+': '+damage+' урона.');d.cooldown=move==='skill'?2:Math.max(0,d.cooldown-1);if(d.enemyHp===0){arenaFinish(true);return}const power=d.turn%3===0?1.5:1,reply=arenaDamage(d.enemy.str,d.stats.armorStat,d.enemy.agi,d.enemy.stance,d.stance,power*(move==='guard'?.35:1));d.hp=Math.max(0,d.hp-reply);d.log.push(d.enemy.name+': '+reply+' урона'+(power>1?' мощным выпадом.':'.'));d.turn++;if(!d.hp)arenaFinish(false)}
function arenaFinish(win){const a=s.arena,d=a.duel;if(!d)return;const delta=win?d.winRating:-Math.min(a.rating,16),tokens=win?d.tokens:1;a.rating=Math.max(0,a.rating+delta);a.tokens+=tokens;if(win)a.wins++;else a.losses++;a.history.unshift({win,delta,tokens,enemy:{...d.enemy},at:Date.now()});a.history=a.history.slice(0,30);a.duel=null;a.opponents=[];arenaPage='history';notice=(win?'Победа! ':'Поражение. ')+signed(delta)+' рейтинга · +'+tokens+' жетонов. Здоровье персонажа сохранено.'}
function arenaAction(type,arg){normalizeArena();if(type==='arenaTab'){arenaPage=['opponents','history','shop'].includes(arg)?arg:'opponents';return}if(type==='arenaMove'){arenaMove(arg);return}if(s.arena.duel){notice='Сначала заверши поединок.';return}if(type==='arenaStance'&&arenaStances[arg])s.arena.stance=arg;if(type==='arenaRefresh')s.arena.opponents=[];if(type==='arenaStart')arenaStart(s.arena.opponents[Number(arg)]);if(type==='arenaRematch')arenaStart(s.arena.history[Number(arg)]?.enemy);if(type==='arenaBuy'){const g=arenaGoods.find(x=>x.id===arg);if(g&&s.arena.tokens>=g.cost){s.arena.tokens-=g.cost;if(arg==='potion')s.potions+=3;if(arg==='dust')s.dust+=150;if(arg==='gear'){const set=s.level>=20?'veteran':s.level>=10?'soldier':'recruit';s.bag.push(makeItem(slotSpecs[Math.floor(Math.random()*slotSpecs.length)][0],set,2))}notice='Получено: '+g.name+'.'}}}

document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action)});document.addEventListener('change',e=>{if(e.target.id==='save-file')importSave(e.target.files?.[0])});document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();submitAuth(e.target)}});if(typeof setInterval==='function')setInterval(()=>{enemyTick();const button=document.querySelector?.('.arena-attack');if(button&&s.battle)button.textContent=`Атаковать · ${Math.round(strikePercent(Date.now()-s.battle.lastAttackAt))}%`;const potionButton=document.querySelector?.('.potion-use');if(potionButton){potionButton.textContent=potionLabel(!!s.battle);potionButton.disabled=!canDrinkPotion()||tab==='hero'&&!!s.battle}const before=s.hp;applyRegen();if(s.hp!==before){const wasOpen=document.querySelector?.('.stats-tab')?.open;render();if(wasOpen){const stats=document.querySelector?.('.stats-tab');if(stats)stats.open=true}}},250);normalizeSave();render();
</script></body></html>
