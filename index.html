:root{color-scheme:dark;--bg:#101511;--panel:#1a211b;--line:#343d30;--text:#e8e5d5;--muted:#9da68f;--gold:#cfb779}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit;border:1px solid var(--line);border-radius:8px;background:#252e24;padding:12px 16px;min-height:46px}button:hover{border-color:var(--gold)}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--gold);color:#1b2017;border-color:var(--gold);font-weight:650}header{border-bottom:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:700 23px Georgia,serif;letter-spacing:1px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2px;text-transform:uppercase}.coin{color:var(--gold);white-space:nowrap}main{max-width:1020px;margin:auto;padding:26px 22px 110px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.intro h1{font:32px Georgia,serif;margin:4px 0}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}h2{font:24px Georgia,serif;margin:0 0 14px}h3{font:19px Georgia,serif;margin:0 0 6px}p{margin:8px 0 16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.stat{padding:11px 0;border-bottom:1px solid var(--line)}.bar{height:7px;background:#30382b;border-radius:6px;margin:7px 0 15px;overflow:hidden}.bar i{display:block;height:100%;background:#8caa79;transition:width .25s}.bar.xp i{background:var(--gold)}.crest{margin:0 auto 14px;width:68px;height:78px;border:1px solid #788466;clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);background:#2b3828;display:grid;place-items:center;font:38px Georgia;color:var(--gold)}.profile{text-align:center}.profile h2{margin-bottom:2px}.tag{font-size:11px;color:var(--gold);border:1px solid #53543b;border-radius:4px;padding:3px 8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.location{position:relative;overflow:hidden}.location:before{content:attr(data-n);position:absolute;right:14px;top:-8px;font:100px Georgia;color:#ffffff04;pointer-events:none}.location p{max-width:440px}.location footer{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.log{font-size:14px;padding-left:18px;border-left:2px solid #566647;color:#b6bea9}.log p{margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#151b16f5;border-top:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;padding:10px 12px max(10px,env(safe-area-inset-bottom));gap:8px}.nav button{min-width:100px;border-color:transparent;background:transparent;color:var(--muted)}.nav button.active{color:var(--gold);background:#293024;border-color:#4e533a}.intent{padding:12px 14px;margin:12px 0 18px;border:1px solid #55583c;background:#292e20;border-radius:8px}.intent strong{color:var(--gold)}.notice{padding:12px 16px;border:1px solid #55583c;background:#292e20;border-radius:8px;margin-bottom:16px}.hint{font-size:12px}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item button{font-size:13px;padding:8px 12px}.danger{color:#dcb39e}@media(max-width:700px){header{padding:14px 16px}.brand{font-size:21px}main{padding:20px 14px 105px}.intro{margin-bottom:18px}.intro h1{font-size:28px}.layout{display:block}.sidebar .profile,.sidebar .details{display:none}.sidebar .card{padding:14px}.sidebar .bar{margin-bottom:4px}.sidebar .xp{display:none}.sidebar .xp-label{display:none}.card{padding:17px}.nav{gap:2px}.nav button{min-width:0;flex:1;font-size:13px;padding:11px 5px}.intro .tag{display:none}.location footer{align-items:flex-end}}
.hero-layout{display:block}.hero-layout .sidebar{display:none}.hero-top{display:grid;grid-template-columns:120px minmax(0,1fr) 155px;align-items:center;gap:24px;background:linear-gradient(115deg,#263127,#1a211b 65%);border-color:#596047;padding:28px}.hero-mark{width:106px;height:118px;display:grid;place-items:center;color:#dfc88e;font:68px Georgia,serif;border:1px solid #a29162;background:radial-gradient(circle at 50% 20%,#4a583c,#253324);clip-path:polygon(0 0,100% 0,100% 76%,50% 100%,0 76%)}.hero-identity h2{font-size:36px;margin:1px 0 2px}.hero-dot{color:var(--gold);padding:0 4px}.hero-progress{max-width:420px;margin-top:18px}.hero-progress .bar{margin-bottom:10px}.hero-count{border-left:1px solid #596047;padding-left:24px;display:grid;gap:3px}.hero-count strong{font:40px Georgia;color:var(--gold);line-height:1}.hero-count small{font-size:11px}.hero-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile-section{padding:23px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title h2,.profile-section h2{margin:3px 0 13px}.section-copy{font-size:13px;margin:0 0 10px}.points-badge,.bag-count{color:var(--gold);font-size:12px;white-space:nowrap}.points-badge{border:1px solid #6a6545;border-radius:16px;padding:4px 9px}.attribute{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0}.attribute-icon,.inventory-icon,.slot-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1px solid #596047;border-radius:8px;background:#283326;color:var(--gold);font:21px Georgia}.attribute-text,.inventory-text{flex:1;min-width:0}.attribute-text b,.attribute-text small,.inventory-text b,.inventory-text small{display:block}.attribute-text small,.inventory-text small{font-size:12px}.attribute>strong{font:24px Georgia;color:var(--gold)}button.level-button{width:36px;height:36px;min-height:36px;padding:0;font-size:22px;line-height:1}.gear-slot{display:flex;align-items:center;gap:13px;border-top:1px solid var(--line);padding:14px 0}.gear-slot>div{display:grid}.gear-slot b{font-weight:600}.gear-slot small{font-size:11px}.inventory-row{display:flex;align-items:center;gap:11px;padding:15px 0;border-top:1px solid var(--line)}.inventory-text em{font-style:normal;color:var(--gold)}.inventory-actions{display:flex;gap:5px}.inventory-row button{font-size:12px;white-space:nowrap;min-height:36px;padding:7px 10px}.inventory-row button.subtle-action{background:transparent;color:var(--muted)}.potion-icon{color:#a9d19c}.empty-bag{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}.profile-footnote{color:var(--muted);font-size:12px;margin:4px 0 15px}

.topbar{position:fixed;z-index:30;top:0;left:0;right:0;display:block;padding:0;background:#151c16ee;border-bottom:1px solid #526047;backdrop-filter:blur(12px);box-shadow:0 5px 22px #0005}.location-strip{height:27px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #344132;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#e7e4d3}.location-strip{display:grid;grid-template-columns:1fr auto 1fr}.location-strip #current-location{text-align:center;font-weight:700;color:var(--gold)}.location-strip .coin{justify-self:end;font-size:11px;letter-spacing:0;text-transform:none}.vitals-strip{display:grid;grid-template-columns:3fr 1fr;gap:4px;padding:7px 12px 9px;max-width:1050px;margin:auto}.top-meter{position:relative;height:21px;min-width:0;overflow:hidden;border:1px solid #586753;border-radius:5px;background:#293429}.top-meter .top-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#5c8e60,#86b67a);transition:width .25s}.top-meter.exp-meter{border-color:#6f613d;background:#393429}.top-meter.exp-meter .top-fill{background:linear-gradient(90deg,#b49350,#d3b979)}.top-meter-text{position:relative;z-index:1;display:block;text-align:center;white-space:nowrap;line-height:19px;font-size:11px;font-weight:700;color:#faf5df;text-shadow:0 1px 2px #0009}.exp-meter .top-meter-text{font-size:10px}main{padding-top:94px}@media(max-width:700px){main{padding-top:84px}.location-strip{padding:0 12px}.vitals-strip{padding:6px 9px 8px;gap:3px}.top-meter{height:20px}.top-meter-text{line-height:18px}.exp-meter .top-meter-text{font-size:9px}}
.main-layout{display:block}.main-layout .sidebar{display:none}.main-layout .main-choices{max-width:680px;margin:0 auto}.stats-tab{padding:0;overflow:hidden}.stats-tab summary{cursor:pointer;list-style:none;padding:17px 21px;font:20px Georgia,serif;color:var(--gold)}.stats-tab summary::-webkit-details-marker{display:none}.stats-tab summary::after{content:"⌄";float:right}.stats-tab[open] summary::after{content:"⌃"}.stats-content{display:flex;justify-content:space-between;align-items:center;padding:14px 21px;border-top:1px solid var(--line)}.stats-content strong{font:24px Georgia;color:var(--gold)}.equipment-card{padding:0;overflow:hidden;background:linear-gradient(180deg,#202921,#141b17);border-color:#536047}.equipment-heading{text-align:center;padding:13px 12px;border-bottom:1px solid #3a4739}.equipment-heading h2{font-size:24px;margin:0}.equipment-heading h2 span{font:15px system-ui;color:var(--muted)}.equipment-display{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:16px;align-items:stretch;max-width:610px;margin:auto;padding:16px}.slot-column{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:5px 0}.equipment-slot{position:relative;display:grid;place-items:center;aspect-ratio:1;border:1px solid #52624d;border-radius:9px;background:radial-gradient(circle at 50% 30%,#344032,#19231b);color:#7f9080;box-shadow:inset 0 0 0 3px #141b16;font:29px Georgia,serif}.equipment-slot.is-equipped{color:#e1bd71;border-color:#b49660;box-shadow:inset 0 0 0 3px #1b261b,0 0 11px #c7a56345}.equipment-slot b{position:absolute;right:3px;bottom:2px;font:700 10px system-ui;color:#f5dfaa}.character-frame{min-width:0;height:410px;overflow:hidden;border:2px solid #788b83;border-radius:12px;background:radial-gradient(ellipse at 50% 40%,#364b3a,#141c17 72%);box-shadow:0 0 18px #85ac8b42,inset 0 0 24px #0009}.character-frame img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom}@media(max-width:700px){.equipment-display{grid-template-columns:47px minmax(0,1fr) 47px;gap:8px;padding:10px}.character-frame{height:370px}.equipment-slot{font-size:23px}.equipment-heading h2{font-size:20px}}@media(max-width:380px){.equipment-display{grid-template-columns:42px minmax(0,1fr) 42px;gap:6px}.character-frame{height:330px}.equipment-slot{font-size:20px}}
</style></head><body><header class="topbar"><div class="location-strip"><span class="location-spacer" aria-hidden="true"></span><span id="current-location"></span><span class="coin" id="gold"></span></div><div class="vitals-strip" id="top-vitals"></div></header><main id="app"></main><nav class="nav" id="nav" aria-label="Разделы игры"></nav><script>
const KEY='pogranichye-v1';
const areas=[{name:'Сумрачный лес',desc:'За старой мельницей снова слышен вой. Расчистите тропу к поселению.',level:1,enemy:'Лесной волк',hp:27,atk:7,xp:18,gold:12},{name:'Заброшенный тракт',desc:'Разбойники собирают дань с караванов. Пора напомнить им, кому принадлежит дорога.',level:2,enemy:'Дозорный разбойников',hp:48,atk:11,xp:32,gold:22},{name:'Старая крепость',desc:'За воротами вас ждёт Серый Клык — главарь банды. Верните покой Вороньему броду.',level:4,enemy:'Серый Клык',hp:95,atk:17,xp:70,gold:60}];
const fresh=()=>({level:1,xp:0,gold:25,hp:60,str:5,agi:3,vit:5,points:0,potions:3,weapon:0,armor:0,kills:0,boss:0,claimed:false,bag:[],battle:null});
let s=fresh(),tab='main',notice='',storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&Number.isFinite(v.level)&&Array.isArray(v.bag))s={...s,...v};}}catch{storageOK=false}
const maxhp=()=>40+s.vit*4;const attack=()=>s.str*2+3+s.weapon;const defense=()=>Math.floor(s.agi/2)+s.armor;const need=()=>s.level*35;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{storageOK=false}}
function button(text,action,disabled=false,cls=''){return `<button class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`}
function meter(value,max,cls=''){return `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,value/max*100))}%"></i></div>`}
function render(){save();document.getElementById('gold').textContent=`◈ ${s.gold}`;document.getElementById('current-location').textContent=tab==='journey'&&s.battle?'Битва':({main:'Главная',hero:'Профиль',journey:'Походы',town:'Поселение'}[tab]||'Главная');const hpPercent=Math.round(s.hp/maxhp()*100),xpPercent=Math.round(s.xp/need()*100);document.getElementById('top-vitals').innerHTML=`<div class="top-meter hp-meter" role="progressbar" aria-label="Здоровье" aria-valuenow="${s.hp}" aria-valuemin="0" aria-valuemax="${maxhp()}"><span class="top-fill" style="width:${hpPercent}%"></span><span class="top-meter-text">♥ ${s.hp} / ${maxhp()}</span></div><div class="top-meter exp-meter" role="progressbar" aria-label="Опыт уровня" aria-valuenow="${s.xp}" aria-valuemin="0" aria-valuemax="${need()}"><span class="top-fill" style="width:${xpPercent}%"></span><span class="top-meter-text">ОПЫТ ${xpPercent}%</span></div>`;document.getElementById('nav').innerHTML=[['main','⌂','На главную'],['hero','♙','Герой'],['town','◇','Дом']].map(([id,icon,name])=>button(`${icon} ${name}`,'tab:'+id,false,tab===id?'active':'')).join('');document.getElementById('app').innerHTML=(tab==='main'||tab==='hero')?`${notice?`<div class="notice" role="status">${notice}</div>`:''}${!storageOK?'<div class="notice">Браузер не позволяет сохранить прогресс. Не закрывайте страницу.</div>':''}<div class="layout ${tab==='main'?'main-layout':'hero-layout'}"><section>${content()}</section></div>`:`<div class="intro"><div><div class="eyebrow">Хроники Вороньего брода</div><h1>${{main:'Выберите свой путь',hero:'Профиль героя',journey:'За пределами стен',town:'Вороний брод'}[tab]}</h1><span class="muted">${s.boss?'В крепости снова поднят королевский флаг.':'На краю королевства каждый меч имеет значение.'}</span></div><span class="tag">Глава I · Пограничье</span></div>${notice?`<div class="notice" role="status">${notice}</div>`:''}${!storageOK?'<div class="notice">Браузер не позволяет сохранить прогресс. Не закрывайте страницу.</div>':''}<div class="layout ${tab==='hero'?'hero-layout':tab==='main'?'main-layout':''}"><aside class="sidebar"><div class="card"><div class="profile"><div class="crest">♜</div><h2>Странник</h2><p class="muted">${s.level<4?'Начинающий наёмник':'Защитник пограничья'} · ${s.level} уровень</p></div><div class="row"><small>Здоровье</small><span>${s.hp} / ${maxhp()}</span></div>${meter(s.hp,maxhp())}<div class="row xp-label"><small>Опыт · уровень ${s.level}</small><small>${s.xp} / ${need()}</small></div>${meter(s.xp,need(),'xp')}<div class="details"><div class="row stat"><span>Атака</span><b>${attack()}</b></div><div class="row stat"><span>Защита</span><b>${defense()}</b></div><div class="row stat"><span>Победы</span><b>${s.kills}</b></div><p class="hint">Прогресс сохраняется в этом браузере автоматически.</p></div></div></aside><section>${content()}</section></div>`}
function content(){if(tab==='main')return mainScreen();if(s.battle&&tab==='journey')return battleView();if(tab==='journey')return `<div class="row" style="margin-bottom:14px"><h2 style="margin:0">Выберите поход</h2><small>3 локации</small></div>`+areas.map((a,i)=>`<article class="card location" data-n="0${i+1}"><div class="eyebrow">${i===2?'Босс главы':'Поход'} · уровень ${a.level}+</div><h2 style="margin-top:7px">${a.name}</h2><p class="muted">${a.desc}</p><footer><small>◈ ${a.gold} золота &nbsp; ✧ ${a.xp} опыта</small>${button(s.level<a.level?'С '+a.level+' уровня':'В поход →','start:'+i,s.level<a.level||s.hp<=0,'primary')}</footer></article>`).join('')+'<p class="hint">В бою выбирайте приёмы. Между походами можно бесплатно отдохнуть в поселении.</p>';
if(tab==='hero')return heroProfile();
return `<div class="card"><div class="eyebrow">Доска поручений</div><h2 style="margin-top:7px">Безопасные дороги</h2><p class="muted">Староста просит очистить окрестности от угроз. Одержите 5 побед в любых походах.</p><div class="row"><span>Победы: ${Math.min(s.kills,5)} / 5</span><span class="coin">Награда: 50 ◈</span></div>${meter(Math.min(s.kills,5),5)}${button(s.claimed?'Награда получена':'Забрать награду','claim',s.kills<5||s.claimed,'primary')}</div><div class="card"><h2>Таверна «У переправы»</h2><p class="muted">Для защитников поселения всегда найдётся свободная кровать.</p>${button('Отдохнуть · бесплатно','rest',!!s.battle||s.hp===maxhp())}</div><div class="card"><h2>Лавка травника</h2><p class="muted">Малое зелье восстанавливает 30 здоровья. В бою его применение занимает ход.</p>${button('Купить зелье · 15 ◈','buy',s.gold<15||!!s.battle)}</div>${s.battle?'<p class="danger">Сначала завершите бой или отступите во вкладке «Походы».</p>':''}`}
function mainScreen(){return `<div class="main-choices"><button class="main-choice" data-action="tab:journey"><span class="choice-icon">⚔</span><span class="choice-copy"><small>ПРИКЛЮЧЕНИЕ</small><strong>${s.battle?'Вернуться в бой':'Походы'}</strong><span>${s.battle?'Противник ждёт вашего хода':'Три локации, противники и добыча'}</span></span><span class="choice-arrow">→</span></button><button class="main-choice" data-action="tab:town"><span class="choice-icon">⌂</span><span class="choice-copy"><small>ВОРОНИЙ БРОД</small><strong>Поселение</strong><span>Отдых, задания и лавка травника</span></span><span class="choice-arrow">→</span></button></div>`}
function equipmentSlot(label,icon,value=''){return `<div class="equipment-slot ${value?'is-equipped':''}" title="${label}" aria-label="${label}${value?' '+value:''}"><span>${icon}</span>${value?`<b>${value}</b>`:''}</div>`}
function heroProfile(){const role=s.level<4?'Начинающий наёмник':'Защитник пограничья';return `<div class="equipment-card card"><div class="equipment-heading"><h2>Странник <span>· ${s.level} уровень</span></h2></div><div class="equipment-display"><div class="slot-column">${equipmentSlot('Голова','♙')}${equipmentSlot('Плечи','◈')}${equipmentSlot('Перчатки','✧')}${equipmentSlot('Ноги','⌁')}${equipmentSlot('Доспех',s.armor?'♜':'◇',s.armor?'+'+s.armor:'')}</div><div class="character-frame"><img src="knight.webp" alt="Рыцарь в доспехах" loading="eager"></div><div class="slot-column">${equipmentSlot('Шея','◇')}${equipmentSlot('Плащ','⌁')}${equipmentSlot('Кольцо','◌')}${equipmentSlot('Оружие','⚔',s.weapon?'+'+s.weapon:'')}${equipmentSlot('Обувь','◇')}</div></div></div><div class="hero-columns"><div><div class="card profile-section"><div class="section-title"><div><div class="eyebrow">Развитие</div><h2>Характеристики</h2></div><span class="points-badge">${s.points} очк.</span></div><p class="muted section-copy">После нового уровня распределите 3 очка между навыками.</p>${[['str','Сила','Урон оружием','+2 к атаке','⚔'],['agi','Ловкость','Уклонение и защита','Каждые 2 очка: +1 к защите','✦'],['vit','Выносливость','Запас здоровья','+4 к здоровью','✚']].map(([k,t,d,e,icon])=>`<div class="attribute"><div class="attribute-icon">${icon}</div><div class="attribute-text"><b>${t}</b><small>${d} · ${e}</small></div><strong>${s[k]}</strong>${button('+','stat:'+k,!s.points||!!s.battle,'level-button')}</div>`).join('')}</div><div class="card profile-section"><h2>Снаряжение</h2><div class="gear-slot"><span class="slot-icon">⚔</span><div><small>ОРУЖИЕ</small><b>${s.weapon?'Стальной меч':'Старый меч'}</b><small>${s.weapon?'+'+s.weapon+' к атаке':'Базовое оружие'}</small></div></div><div class="gear-slot"><span class="slot-icon">♜</span><div><small>ДОСПЕХ</small><b>${s.armor?'Кожаный доспех':'Дорожная одежда'}</b><small>${s.armor?'+'+s.armor+' к защите':'Базовая защита'}</small></div></div></div></div><div><div class="card profile-section"><div class="section-title"><div><div class="eyebrow">Предметы в пути</div><h2>Сумка</h2></div><span class="bag-count">${s.bag.length+1} поз.</span></div><div class="inventory-row"><span class="inventory-icon potion-icon">✚</span><div class="inventory-text"><b>Малое зелье здоровья <em>× ${s.potions}</em></b><small>Восстанавливает 30 здоровья</small></div>${button('Выпить','potion',s.potions<1||s.hp===maxhp()||!!s.battle,'inventory-action')}</div>${s.bag.map((it,i)=>`<div class="inventory-row"><span class="inventory-icon">${it.type==='weapon'?'⚔':'♜'}</span><div class="inventory-text"><b>${it.type==='weapon'?'Стальной меч':'Кожаный доспех'}</b><small>+${it.value} к ${it.type==='weapon'?'атаке':'защите'}</small></div><div class="inventory-actions">${button('Надеть','equip:'+i,!!s.battle,'inventory-action')}${button('Продать · 8 ◈','sell:'+i,!!s.battle,'subtle-action')}</div></div>`).join('')}${!s.bag.length?'<div class="empty-bag">Пока пусто. Снаряжение появляется после каждого второго побеждённого врага.</div>':''}</div></div></div><details class="stats-tab card"><summary>Статистика</summary><div class="stats-content"><span>Победы</span><strong>${s.kills}</strong></div></details>`}
const patterns=[
 [{name:'Обычный укус',detail:'Обычная атака.',power:1}, {name:'Прыжок',detail:'Сильный удар. Защита снизит урон.',power:1.8}, {name:'Переводит дух',detail:'Слабая атака. Удобный момент для выпада.',power:.5}],
 [{name:'Поднимает щит',detail:'Получит меньше урона в этот ход.',power:.6,block:.35}, {name:'Удар клинком',detail:'Обычная атака.',power:1}, {name:'Замах',detail:'Сильный удар. Защита снизит урон.',power:1.7}],
 [{name:'Тяжёлый замах',detail:'Очень сильный удар. Защита снизит урон.',power:1.9}, {name:'Прикрывается',detail:'Получит меньше урона в этот ход.',power:.75,block:.5}, {name:'Быстрый выпад',detail:'Обычная атака.',power:1}]
];
function intent(b){return patterns[b.area][(b.turn-1)%patterns[b.area].length]}
function battleView(){const b=s.battle,a=areas[b.area];return `<div class="card"><div class="eyebrow">${a.name} · ход ${b.turn}</div><h2 style="margin-top:8px">${a.enemy}</h2><div class="row"><small>Здоровье противника</small><span>${b.hp} / ${a.hp}</span></div>${meter(b.hp,a.hp)}<div class="intent"><small>НАМЕРЕНИЕ ВРАГА</small><br><strong>${intent(b).name}</strong> · ${intent(b).detail}</div><div class="actions">${button('⚔ Удар','fight:hit',false,'primary')}${button('♜ Защита','fight:guard')}${button(b.cooldown?'Выпад · '+b.cooldown:'✦ Мощный выпад','fight:skill',b.cooldown>0)}</div><p class="hint">Защита: слабый удар и −70% входящего урона. Выпад: двойной урон, затем 2 хода восстановления.</p><div class="actions">${button('Зелье · '+s.potions,'fight:potion',!s.potions||s.hp===maxhp())}${button('Отступить','flee')}</div></div><div class="card"><h3>Хроника боя</h3><div class="log" aria-live="polite">${b.log.slice(-6).map(l=>`<p>${l}</p>`).join('')}</div></div>`}
function act(action){const [type,arg]=action.split(':');notice='';if(type==='tab'){tab=arg;render();return}if(s.battle&&!['fight','flee'].includes(type)){notice='Завершите бой перед этим действием.';render();return}
if(type==='start'){const i=Number(arg),a=areas[i];if(a&&s.level>=a.level&&s.hp>0){s.battle={area:i,hp:a.hp,turn:1,cooldown:0,log:[`${a.enemy} преграждает вам путь.`]};tab='journey'}}
if(type==='fight')fight(arg);
if(type==='flee'){s.battle=null;notice='Вы отступили к поселению. Добыча осталась у врага.';tab='town'}
if(type==='rest'){s.hp=maxhp();notice='Вы отдохнули. Здоровье полностью восстановлено.'}
if(type==='buy'&&s.gold>=15){s.gold-=15;s.potions++;notice='Зелье добавлено в сумку.'}
if(type==='potion'&&s.potions&&s.hp<maxhp()){s.potions--;s.hp=Math.min(maxhp(),s.hp+30)}
if(type==='stat'&&['str','agi','vit'].includes(arg)&&s.points>0){s[arg]++;s.points--;if(arg==='vit')s.hp+=4}
if(type==='claim'&&s.kills>=5&&!s.claimed){s.claimed=true;s.gold+=50;notice='Староста благодарит вас. Получено 50 золота.'}
if(['equip','sell'].includes(type)&&s.bag[Number(arg)]){const it=s.bag.splice(Number(arg),1)[0];if(type==='sell')s.gold+=8;else{const prev=s[it.type];s[it.type]=it.value;if(prev)s.bag.push({type:it.type,value:prev});notice='Снаряжение надето.'}}
render()}
function fight(move){const b=s.battle;if(!b)return;const a=areas[b.area],enemyMove=intent(b);if(!['hit','guard','skill','potion'].includes(move)||move==='skill'&&b.cooldown>0||move==='potion'&&(!s.potions||s.hp===maxhp()))return;
if(move==='potion'){s.potions--;const heal=Math.min(30,maxhp()-s.hp);s.hp+=heal;b.log.push(`Зелье восстановило ${heal} здоровья.`)}else{const raw=Math.max(1,Math.round(attack()*(move==='skill'?2:move==='guard'?.45:1)));const damage=Math.max(1,Math.round(raw*(enemyMove.block??1)));b.hp=Math.max(0,b.hp-damage);b.log.push(`${move==='skill'?'Мощный выпад':move==='guard'?'Осторожный удар':'Ваш удар'}: ${damage} урона${enemyMove.block?' (враг прикрылся)':''}.`)}
if(b.hp<=0){s.kills++;s.gold+=a.gold;s.xp+=a.xp;if(b.area===2)s.boss++;notice=`Победа! +${a.xp} опыта и +${a.gold} золота.`;if(s.kills%2===0){const type=s.kills%4===0?'armor':'weapon';s.bag.push({type,value:(b.area+1)*2+Math.floor(s.level/2)});notice+=' Найдено снаряжение — загляните в сумку.'}while(s.xp>=need()){s.xp-=need();s.level++;s.points+=3;s.hp=maxhp();notice+=` Новый уровень ${s.level}! +3 очка развития.`}if(b.area===2)notice+=' Глава завершена: Вороний брод спасён! Можно продолжать походы.';s.battle=null;return}
const damage=Math.max(1,Math.round(Math.max(1,a.atk-defense())*enemyMove.power*(move==='guard'?.3:1)));s.hp=Math.max(0,s.hp-damage);b.log.push(`${a.enemy} — ${enemyMove.name.toLowerCase()}: ${damage} урона вам.`);b.cooldown=move==='skill'?2:Math.max(0,b.cooldown-1);b.turn++;
if(s.hp===0){const lost=Math.min(s.gold,8);s.gold-=lost;s.battle=null;notice=`Вас нашли стражники и доставили в поселение. Потеряно ${lost} золота. Отдохните в таверне перед новым походом.`;tab='town'}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action)});render();
</script></body></html>
