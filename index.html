function normalizeSave(){s.souls=Math.max(0,Math.floor(Number(s.souls)||0));delete s.claimed;if(s.battle&&!s.battle.quest&&!s.battle.bossId&&s.battle.enemy){const enemy=s.battle.enemy,ratio=Math.max(0,Math.min(1,enemy.hp/Math.max(1,enemy.maxHp)));Object.assign(enemy,locationMobStats(s.battle.location||0));enemy.hp=Math.max(1,Math.round(enemy.maxHp*ratio))}delete s.arena;if(!['new','active','ready','done'].includes(s.firstPath))s.firstPath='new';s.silver=Math.max(0,Math.floor(Number(s.silver)||0));s.gold=Math.max(0,Math.floor(Number(s.gold)||0))+Math.floor(s.silver/100);s.silver%=100;s.dust=Math.max(0,Math.floor(Number(s.dust)||0));s.skills=s.skills&&typeof s.skills==='object'?s.skills:{};for(const skill of skillSpecs)s.skills[skill.id]=Math.max(0,Math.min(10,Math.floor(Number(s.skills[skill.id])||0)));delete s.bronze;s.equipment=s.equipment&&typeof s.equipment==='object'?s.equipment:{};if(s.weapon){s.equipment.sword={slot:'sword',set:'recruit',rarity:0,quality:{health:25,str:100,armorStat:25,agi:25},stats:{health:0,str:s.weapon,armorStat:0,agi:0}};s.weapon=0}if(s.armor){s.equipment.armor={slot:'armor',set:'recruit',rarity:0,quality:{health:25,str:25,armorStat:100,agi:25},stats:{health:0,str:0,armorStat:s.armor,agi:0}};s.armor=0}s.bag=s.bag.map(it=>it.slot?it:it.type?{slot:it.type==='weapon'?'sword':'armor',set:'recruit',rarity:0,quality:{health:25,str:25,armorStat:25,agi:25},stats:{health:0,str:it.type==='weapon'?it.value:0,armorStat:it.type==='armor'?it.value:0,agi:0}}:null).filter(Boolean).map(normalizeItem);for(const it of Object.values(s.equipment))if(it)normalizeItem(it)}

const totalStat=key=>s[key]+gearStat(key);const maxhp=()=>Math.round(totalStat('health')*5*(soldierSetCount()>=4?1.05:1));const regenRate=()=>Math.floor(maxhp()/50);const attack=()=>totalStat('str')*(soldierSetCount()>=6?1.08:1);const defense=()=>Math.round(totalStat('armorStat')*(1+soldierArmorBonus()));const armorPercent=()=>armorReductionPercent(defense());const critPercent=()=>Math.min(50,totalStat('agi')*.5);const need=()=>s.level*100;
function itemName(it){const names={helmet:'Шлем',shoulder:'Наплечники',gauntlet:'Перчатки',greaves:'Поножи',armor:'Доспех',necklace:'Ожерелье',cloak:'Плащ',ring:'Кольцо',sword:'Меч',boots:'Сапоги'};return `${names[it.slot]||'Предмет'} ${setSpecs[it.set]?.name||'рекрута'}${it.sharpen?' +'+it.sharpen:''}`}

function bossTime(seconds){return Math.floor(seconds/3600)+':'+String(Math.floor(seconds%3600/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function bossScreen(){const remaining=bossRemaining(),active=s.battle?.bossId==='banditChief';return `<div class="boss-list">${button('Главарь разбойников · 1 уровень'+(remaining?' · '+bossTime(remaining):''),active?'tab:journey':'bossStart',!active&&(remaining>0||s.hp<=0||s.level<1||!!s.battle),'boss-row'+(active?'':' boss-start'))}</div>`}
function startBanditChief(){if(s.battle||s.level<1||s.hp<=0||bossRemaining()>0)return;s.battle={bossId:'banditChief',location:0,wave:1,wins:0,enemy:{kind:5,name:'Главарь разбойников',health:150,str:150,atk:150,armorStat:150,agi:150,hp:750,maxHp:750,xp:500},turn:1,cooldown:0,guarding:false,lastAttackAt:Date.now()-3000,nextBiteAt:Date.now()+3000,log:['Главарь разбойников обнажает два клинка.']};tab='journey'}
function finishBanditChief(){const item=makeItem(slotSpecs[Math.floor(Math.random()*slotSpecs.length)][0],'soldier',2+Math.floor(Math.random()*4));s.pendingBossReward={item,xp:500,silver:10};s.kills++;s.boss++;s.bossReadyAt=Date.now()+3600000;s.battle=null;tab='bosses';notice=''}
function claimBossReward(){const reward=s.pendingBossReward;if(!reward)return;delete s.pendingBossReward;s.bag.push(reward.item);gainExperience(reward.xp);addSilver(reward.silver);tab='main';notice='';save();queueCloudSave()}
function bossVictoryScreen(){const reward=s.pendingBossReward,it=reward.item,rarity=itemRarity(it);return `<section class="victory-screen" aria-label="Победа над боссом"><div class="victory-crown" aria-hidden="true">⚔</div><div class="eyebrow">Бой завершён</div><h1>Победа</h1><p class="victory-enemy">Главарь разбойников повержен</p><div class="victory-divider" aria-hidden="true"><span>◆</span></div><div class="victory-rewards-title">Твоя награда</div><div class="victory-resources"><div><span class="victory-resource-icon">✦</span><strong>+${reward.xp}</strong><small>опыта</small></div><div>${resourceIcon('silver')}<strong>+${reward.silver}</strong><small>серебра</small></div></div><div class="victory-item rarity-${rarity.className}"><span class="victory-item-icon inventory-icon">${itemIcon(it)}</span><div><small class="item-rarity">${rarity.name}</small><strong>${itemName(it)}</strong><div class="victory-item-stats">${statKeys.map(key=>`<span>${{health:'Здоровье',str:'Сила',armorStat:'Броня',agi:'Ловкость'}[key]} <b>+${itemStat(it,key)}</b></span>`).join('')}</div></div></div>${button('Забрать','claimBossReward',false,'primary victory-claim')}</section>`}

function mainScreen(){return `<div class="main-choices"><button class="main-choice" data-action="tab:journey"><span class="choice-icon">${icon('sword')}</span><span class="choice-copy"><strong>${s.battle?'Вернуться в бой':'Окрестности'}</strong></span></button><button class="main-choice" data-action="tab:dungeons"><span class="choice-icon">${icon('shield')}</span><span class="choice-copy"><strong>${raidActive()?'Подземелья · продолжить':'Подземелья'}</strong></span></button><button class="main-choice" data-action="tab:bosses"><span class="choice-icon">${icon('trophy')}</span><span class="choice-copy"><strong>Боссы</strong></span></button><button class="main-choice" data-action="tab:town"><span class="choice-icon">${icon('potion')}</span><span class="choice-copy"><strong>Таверна</strong></span></button><button class="main-choice" data-action="tab:market"><span class="choice-icon">${icon('ring')}</span><span class="choice-copy"><strong>Торговая площадь</strong></span></button></div>`}
const firstPathFoes=[{name:'Пьянчуга Карл',hp:40,str:25,armorStat:25,agi:25},{name:'Пьянчуга Аргос',hp:50,str:35,armorStat:35,agi:35}];
function firstPathEnemy(index){const a=firstPathFoes[index];return {...a,kind:2,maxHp:a.hp,atk:a.str,xp:0}}
const storySpecs={lastCup:{title:'Последняя кружка',level:1,npc:'Бармен Лайт'},palisade:{title:'Ночь у частокола',level:3,npc:'Капрал Рейн'},seal:{title:'Чужая печать',level:4,npc:'Кузнец Бран'},bell:{title:'Тот, кто носит колокольчик',level:6,npc:'Охотник Грей'},silence:{title:'Цена тишины',level:8,npc:'Бармен Лайт'}};
function storyState(id){s.stories=s.stories&&typeof s.stories==='object'?s.stories:{};return s.stories[id]||(s.stories[id]={stage:'intro',flags:{},wave:0})}
function storyEnemy(name,hp,str,armorStat,agi,extra={}){return {name,hp,maxHp:hp,str,atk:str,armorStat,agi,kind:2,...extra}}
function storyReward(id,xp,silver=0,dust=0,potions=0,gear=null){const q=storyState(id);if(q.stage==='ready'||q.stage==='done')return;q.reward={xp,silver,dust,potions,item:gear?makeItem(slotSpecs[Math.floor(Math.random()*slotSpecs.length)][0],gear.set,gear.rarity):null};q.stage='ready';tab='town';tavernPage=id}
function storyRewardView(r){return `<div class="story-rewards"><div class="row"><span>Опыт</span><b>+${r.xp}</b></div>${r.silver?`<div class="row"><span>Серебро</span><b>+${r.silver}</b></div>`:''}${r.dust?`<div class="row"><span>Пыль</span><b>+${r.dust}</b></div>`:''}${r.potions?`<div class="row"><span>Зелья здоровья</span><b>+${r.potions}</b></div>`:''}${r.item?`<div class="story-loot rarity-${itemRarity(r.item).className}"><span class="inventory-icon">${itemIcon(r.item)}</span><div><b>${itemName(r.item)}</b><small class="item-rarity">${itemRarity(r.item).name}</small></div></div>`:''}</div>`}
function storyView(id){const q=storyState(id),f=q.flags,stage=q.stage;const v=(text,choices=[])=>({text,choices});if(stage==='done')return v('Задание завершено. Награда получена.');if(stage==='ready')return v(q.ending||'Дело сделано. Пора забрать заслуженную награду.',[['claim','Забрать']]);if(stage==='battle')return v('Дело ещё не закончено. Противник ждёт тебя.',[['resume','Вернуться в бой']]);if(stage==='retry')return v('Пришлось отступить. Восстанови здоровье и попробуй снова. Уже сделанные выборы сохраняются.',[['retry','Попробовать снова']]);
if(id==='lastCup'){if(stage==='intro')return v('Лайт ставит на стойку поднос с остывающим ужином. «Постоялец наверху третьи сутки не выходит. Деньги за комнату внёс, а к еде не прикасается. Проверь, жив ли он». Из-за двери слышен скрежет: кто-то пододвигает к ней тяжёлый сундук.',[['call','Позвать Лайта'],['break','Взломать дверь'],['courier','Представиться посыльным']]);if(stage==='room')return v((f.entry==='break'?'Дверь поддаётся с треском. Постоялец отшатывается от тебя.':f.entry==='call'?'Лайт отпирает комнату запасным ключом и остаётся у лестницы.':'Услышав о доставке, постоялец отодвигает сундук и приоткрывает дверь.')+' На столе лежит раскрытый кошелёк, у окна — дорожная сумка. «Я не вор. После неурожая сборщик потребовал подать второй раз. Отдам последнее — детям нечего будет есть». На лестнице гремят сапоги. «Именем казны! Открывайте!»', [['hear','Выслушать сборщика']]);if(stage==='decision')return v('Сборщик показывает долговую расписку. На ней нет даты, а печать размазана. Постоялец умоляет не отдавать его. Сборщик замечает твой меч и предлагает 12 серебра за содействие. Можно выдать беглеца, заплатить за него 10 серебра или силой выгнать сборщика.',[['hand','Выдать беглеца'],['pay','Оплатить долг · 10 серебра'],['fight','Прогнать сборщика']]);}
if(id==='palisade'){if(stage==='intro')return v('На северном посту остались двое стражников. Один держит ворота, второй едва стоит после ранения. Капрал Рейн протягивает тебе сигнальный рожок: «Продержимся до рассвета — придёт смена. Не продержимся — они войдут в город». За частоколом вспыхивают факелы. Предстоит пять нападений. Полная награда: 650 опыта, 25 серебра и 150 пыли.',[['start','Занять пост']]);if(stage==='rest')return v('Нападение '+q.wave+' из 5 отбито. '+['','В темноте стих волчий вой. Но за лесом уже слышны человеческие голоса.','У дозорного находят верёвочную лестницу. Следующий отряд придёт подготовленным.','Стрела вонзается в створку ворот. Рейн прижимает ладонь к ране и молча кивает тебе.','За частоколом собирают тяжёлый таран. До рассвета осталось совсем немного.'][q.wave]+' До следующего нападения успеешь сделать только одно: перевязать раны, укрепить ворота или обыскать павших. Можно уйти сейчас и получить оплату за отбитые волны.',[['heal','Перевязать раны · 30% HP'],['fortify','Укрепить ворота'],['search','Обыскать павших'],['retreat','Отступить с частичной наградой']]);}
if(id==='seal'){if(stage==='intro')return v('Купец бросает на наковальню железную заготовку: «Это из моего каравана! А Бран продаёт её как свою». Кузнец достаёт накладную с городской печатью. «Купил честно. Возчик подтвердит». Если обвинить кого-нибудь без доказательств, настоящий виновник успеет скрыться.',[['investigate','Разобраться в споре']]);if(stage==='investigate')return v('Накладная настоящая на вид, но никто не может объяснить, почему груз привезли ночью. Улики можно собрать в любом порядке.'+(f.driver?' Возчик уже дал показания.':'')+(f.warehouse?' Склад осмотрен.':'')+(f.records?' Записи проверены.':''),[...(!f.driver?[['driver','Расспросить возчика']]:[]),...(!f.warehouse?[['warehouse','Осмотреть склад']]:[]),...(!f.records?[['records','Проверить запись у писаря']]:[]),['accuse','Назвать виновного']]);if(stage==='clue')return v(q.clue,[['back','Продолжить расследование']]);if(stage==='accuse')return v('Купец требует решения. Кузнец смотрит на тебя, не выпуская накладную. Кого ты обвиняешь?', [['smith','Обвинить кузнеца'],['driverGuilty','Обвинить возчика'],['scribe','Обвинить писаря'],['back','Вернуться к уликам']]);if(stage==='scribe')return v('Ты кладёшь улики перед писарем. Он перестаёт улыбаться. «Стража поверит мне. Но можно решить вопрос иначе». Под столом звякает тяжёлый кошель. За спиной писаря встаёт телохранитель.',[['bribe','Взять откупные'],['arrest','Задержать писаря']]);}
if(id==='bell'){if(stage==='intro')return v('Грей приводит к часовне единственного выжившего. Тот всё время зажимает уши: «Шёл на звон. Дошёл до дерева с белой корой. Пошёл обратно — и снова оно». Охотник уверен: лесное существо приманивает путников звуком. Прежде чем идти на звон, нужно найти три следа.',[['track','Осмотреть окрестности часовни']]);if(stage==='track')return v('Вокруг часовни неестественно тихо. Ты можешь осмотреть три места.'+(f.tracks?' Следы у тропы изучены.':'')+(f.tree?' Белое дерево осмотрено.':'')+(f.shrine?' Тайник у алтаря найден.':''),[...(!f.tracks?[['tracks','Изучить следы на тропе']]:[]),...(!f.tree?[['tree','Осмотреть белое дерево']]:[]),...(!f.shrine?[['shrine','Проверить разрушенный алтарь']]:[]),...(f.tracks&&f.tree&&f.shrine?[['bait','Выбрать приманку']]:[])]);if(stage==='clue')return v(q.clue,[['track','Искать дальше']]);if(stage==='bait')return v('Круг замкнулся: существо идёт не на запах крови, а на ответный звон. У корней лежат старые повязки, пропитанные тем, что помогает ему залечивать раны. Приманку нужно выбрать до наступления темноты.',[['meat','Оставить мясо'],['chime','Подвесить найденный колокольчик'],['torch','Развести яркий костёр']]);}
if(id==='silence'){if(stage==='intro')return v('После закрытия Лайт показывает тебе обугленный край записки. «Каждую неделю кошель у старой мельницы. Иначе следующей сгорит таверна. Дважды платил. На третий раз денег не хватит». Он просит не звать стражу: вымогатели узнают об этом раньше, чем кто-нибудь поможет. Нужно выбрать способ встречи.',[['ambush','Устроить засаду'],['follow','Проследить за посыльным'],['fake','Подменить деньги · 15 серебра']]);if(stage==='follow')return v('Посыльный забирает кошель и сворачивает к заброшенному дому. Через щель видны трое разбойников и связанный человек. Под половицей спрятан ключ от задней двери. Можно освободить пленного или дождаться, когда главарь останется один.',[['rescue','Освободить пленного'],['wait','Дождаться главаря']]);if(stage==='rescued')return v('Пленный бесшумно выбирается через заднюю дверь. «Главарь носит старую рану под правым плечом. Заставь его поднять руку — и бей». Он обещает принести тебе лекарства, если выберется в город. Внутри замечают открытую дверь.',[['attack','Вступить в бой']]);}
return v('Пора вернуться к делу.');}
function storyScreen(id){const spec=storySpecs[id],q=storyState(id),view=storyView(id);return `<div class="card story-card"><div class="eyebrow">Задание · ${spec.level} уровень</div><h2>${spec.title}</h2><h3>${spec.npc}</h3><p class="story-copy">${escapeHtml(view.text)}</p>${q.stage==='ready'?storyRewardView(q.reward):''}<div class="story-actions">${view.choices.map(([action,label])=>button(label,'story:'+id+':'+action,s.level<spec.level||(['retry','start','attack','fight','meat','chime','torch','ambush','fake','wait','heal','fortify','search'].includes(action)&&s.hp<=0),action==='claim'?'primary':'')).join('')}</div></div>`}
function storyFight(id,enemies){const q=storyState(id);q.enemies=enemies;q.enemyIndex=0;launchStoryEnemy(id)}
function launchStoryEnemy(id){const q=storyState(id);if(s.battle||s.hp<=0){q.stage='retry';notice='Восстанови здоровье перед боем.';return}q.stage='battle';const enemy=JSON.parse(JSON.stringify(q.enemies[q.enemyIndex]));s.battle={quest:id,story:true,location:0,wave:q.enemyIndex+1,wins:0,enemy,turn:1,cooldown:0,guarding:false,lastAttackAt:Date.now()-3000,nextBiteAt:Date.now()+3000,log:[storySpecs[id].title+' · '+enemy.name]};tab='journey'}
function nightEnemy(wave,fortified){const list=[['Голодный волк',200,35,20,45],['Разбойник-разведчик',280,50,35,55],['Лесной стрелок',330,65,40,70],['Разбойник со щитом',420,75,65,35],['Штурмовик',500,90,60,30]],e=list[wave];return storyEnemy(...e,{fortified:!!fortified})}
function nightReward(q,full){q.ending=full?'Рассвет окрашивает верхушки деревьев. Прибывшая смена поднимает ворота. Рейн снимает с тебя ночной пост: «Город эту ночь запомнит».':'Рейн принимает твой рожок. «Своё ты отстоял. Дальше попробуем сами». Тебе платят за отбитые нападения.';storyReward('palisade',full?650:130*q.wave,(full?25:5*q.wave)+(q.flags.searches||0)*5,full?150:Math.floor(150*q.wave/5),q.flags.searches||0)}
function storyVictory(b){const id=b.quest,q=storyState(id);s.kills++;s.battle=null;tab='town';tavernPage=id;if(q.enemyIndex+1<q.enemies.length){q.enemyIndex++;launchStoryEnemy(id);return}if(id==='lastCup'){q.ending='Сборщик хватает расписку и пятится к лестнице. Постоялец наконец убирает сундук от двери. Лайт приносит свежий ужин и три зелья: «За такое — за счёт заведения». ';storyReward(id,180,0,0,3)}if(id==='palisade'){q.wave++;if(q.wave>=5)nightReward(q,true);else q.stage='rest'}if(id==='seal'){q.ending='Телохранитель бросает оружие. В тайнике писаря находят списки караванов и чистые бланки с городской печатью. Бран забирает накладную: теперь его имя очищено.';storyReward(id,700,30,0,0,{set:'recruit',rarity:2})}if(id==='bell'){q.ending='Последний звон обрывается. Между деревьями впервые слышны птицы. Грей снимает с ветки лоскут одежды пропавшего путника и молча убирает его в сумку.';storyReward(id,1200,40,300,0,{set:'soldier',rarity:2})}if(id==='silence'){q.ending='У старой мельницы больше никто не ждёт кошель. Лайт сжигает записку в очаге и возвращает на дверь обычный засов.'+(q.flags.rescue?' Освобождённый пленник держит слово и приносит пять зелий.':'');storyReward(id,1800,60,0,q.flags.rescue?5:0,{set:'soldier',rarity:2+Math.floor(Math.random()*3)})}}
function storyPay(amount){if(s.gold*100+s.silver<amount){notice='Не хватает серебра.';return false}const rest=s.gold*100+s.silver-amount;s.gold=Math.floor(rest/100);s.silver=rest%100;return true}
function storyAction(id,action){if(!storySpecs[id]||s.level<storySpecs[id].level)return;const q=storyState(id),f=q.flags;if(!storyView(id).choices.some(([key])=>key===action))return;if(action==='claim'){const r=q.reward;q.stage='done';delete q.reward;if(r.item)s.bag.push(r.item);s.dust+=r.dust;s.potions+=r.potions;addSilver(r.silver);gainExperience(r.xp);tab='main';notice='Награда получена.';return}if(action==='resume'){if(s.battle?.quest===id)tab='journey';else{q.stage='retry';launchStoryEnemy(id)}return}if(action==='retry'){launchStoryEnemy(id);return}
if(id==='lastCup'){if(['call','break','courier'].includes(action)){f.entry=action;q.stage='room'}if(action==='hear')q.stage='decision';if(action==='hand'){q.ending='Сборщик уводит постояльца. Лайт убирает нетронутый ужин и больше не спрашивает о комнате наверху.';storyReward(id,180,12)}if(action==='pay'&&storyPay(10)){q.ending='Ты выкупаешь расписку и рвёшь её. Постоялец долго не верит, что может уйти. Лайт оставляет у твоего места три зелья.';storyReward(id,180,0,0,3)}if(action==='fight')storyFight(id,[storyEnemy('Сборщик податей',200,30,25,20)])}
if(id==='palisade'){if(action==='start'){q.wave=0;storyFight(id,[nightEnemy(0,false)])}if(action==='retreat')nightReward(q,false);if(['heal','fortify','search'].includes(action)){if(action==='heal')s.hp=Math.min(maxhp(),s.hp+Math.ceil(maxhp()*.3));if(action==='search')f.searches=(f.searches||0)+1;storyFight(id,[nightEnemy(q.wave,action==='fortify')])}}
if(id==='seal'){if(action==='investigate'||action==='back')q.stage='investigate';const clues={driver:'Возчик клянётся, что кузнец его не нанимал. Платил человек с чернильными пальцами. У телеги он всё время прикрывал левую руку рукавом.',warehouse:'На складе под старой соломой спрятаны ещё три тюка из того же каравана. На бирках стоит дата, когда кузнец был в отъезде. Кто-то заранее приготовил ему обвинение.',records:'В городской книге нет записи об этой поставке. Зато в столе писаря лежит пробный оттиск: та же трещина на печати, что и на накладной. На левой руке писаря свежий ожог от сургуча.'};if(clues[action]){f[action]=true;q.clue=clues[action];q.stage='clue'}if(action==='accuse')q.stage='accuse';if(['smith','driverGuilty','scribe'].includes(action)){if(action==='scribe'&&f.driver&&f.warehouse&&f.records)q.stage='scribe';else{q.ending='Пока стража разбирается с твоим обвинением, писарь исчезает. Без показаний и документов дело разваливается. Купец платит за хлопоты, но виновный остаётся на свободе.';storyReward(id,350,10)}}if(action==='bribe'){q.ending='Ты забираешь кошель. К утру писарь уезжает из города. Обвинения с кузнеца снимают за недостатком доказательств, но караваны продолжат пропадать.';storyReward(id,700,50)}if(action==='arrest')storyFight(id,[storyEnemy('Телохранитель писаря',650,110,100,60)])}

function intent(b){if(b.story)return storyIntent(b);if(b.bossId)return {name:'Два клинка',detail:'Удар каждые 3 секунды · 20% шанс критического удара ×2,25.',power:1};const moves=patterns[b.enemy.kind]||patterns[0];return moves[(b.turn-1)%moves.length]}
function strikePercent(elapsed){return Math.max(1,Math.min(100,1+(Math.max(100,elapsed)-100)*99/2900))}
function battleView(){const b=s.battle,a=b.enemy;return `<div class="card arena-battle"><div class="eyebrow">${b.story?storySpecs[b.quest].title.toUpperCase()+(b.quest==='palisade'?' · ВОЛНА '+(storyState(b.quest).wave+1)+'/5':storyState(b.quest).enemies.length>1?' · БОЙ '+(storyState(b.quest).enemyIndex+1)+'/'+storyState(b.quest).enemies.length:''):b.bossId?'БОСС · ГЛАВАРЬ РАЗБОЙНИКОВ':b.quest==='firstPath'?'ТАВЕРНА · ПЕРВЫЙ ПУТЬ · '+(b.wins+1)+'/2':locations[b.location||0].name.toUpperCase()}</div><div class="arena-enemy"><span class="enemy-portrait" style="--ex:${a.kind%3*50}%;--ey:${a.kind<3?0:100}%" role="img" aria-label="${a.name}"></span><h2>${a.name}</h2></div><div class="row"><small>Здоровье противника</small><span>${a.hp} / ${a.maxHp}</span></div>${meter(a.hp,a.maxHp)}<div class="intent"><strong>${intent(b).name}</strong> · ${intent(b).detail}</div>${button('Атаковать · '+Math.round(strikePercent(Date.now()-b.lastAttackAt))+'%','fight:hit',false,'primary arena-attack')}<div class="actions arena-tools">${button('Защита','fight:guard')}${button(b.cooldown?'Выпад · '+b.cooldown:'Мощный выпад','fight:skill',b.cooldown>0)}${button(potionLabel(true),'fight:potion',!canDrinkPotion(),'potion-use')}</div></div><div class="card"><div class="log" aria-live="polite">${b.log.slice(-4).map(l=>typeof l==='string'?`<p>${escapeHtml(l)}</p>`:`<p class="loot rarity-${l.rarity}">${escapeHtml(l.text)}</p>`).join('')}</div>${button('Покинуть локацию','flee',false,'full-button')}</div>`}
function enemyTick(){const b=s.battle;if(!b)return;const now=Date.now();let changed=false;while(s.battle&&now>=b.nextBiteAt){const a=b.enemy,move=intent(b),special=!!b.bossId&&Math.random()<.2,effectiveArmor=defense()*(1-(move.pierce||0)),reduction=armorReductionPercent(effectiveArmor)/100,damage=Math.max(1,Math.round(a.atk*(b.bossId?(special?2.25:1):(Math.random()*100<Math.min(50,(a.agi||0)*.5)?1.5:1))*(1-reduction)*move.power*(1-.03*skillRank('ward'))*(b.guarding?.3:1)));if(move.heal){const restored=Math.min(a.maxHp-a.hp,Math.ceil(a.maxHp*move.heal));a.hp+=restored;if(restored)b.log.push(`${a.name}: +${restored} здоровья.`)}s.hp=Math.max(0,s.hp-damage);b.log.push(`${a.name}${special?' · Удар с двух рук (крит ×2,25)':''}: ${damage} урона вам.`);b.guarding=false;if(move.preventHeal)a.preventFirstHeal=false;b.nextBiteAt+=move.interval||3000;b.turn++;changed=true;if(s.hp===0){if(b.story){storyState(b.quest).stage='retry';tavernPage=b.quest}s.battle=null;notice='Поражение. Восстановите здоровье.';tab=b.bossId?'bosses':'town'}}if(changed){queueCloudSave();render()}}
function act(action){const [type,arg,detail]=action.split(':');notice='';if(type==='dungeon'){dungeonAction(arg,detail);return}if(raidActive()&&!['tab','profile','downloadSave'].includes(type)){notice='Сначала закончи рейд или откажись от него в разделе «Подземелья».';render();return}if(raidRewardPending()){tab='dungeons';render();return}if(type==='claimBossReward'){claimBossReward();render();return}if(s.pendingBossReward){render();return}if(type==='downloadSave'){downloadSave();return}if(type==='tavern'){tavernPage=tavernQuests.some(q=>q.id===arg)?arg:null;tavernDialogue=false;tab='town';render();return}if(type==='tab'){tab=arg;if(arg==='town')tavernPage=null;if(arg==='hero')profilePage='overview';render();return}if(type==='forgeSource'){forgeSource=arg;forgeSelection=null;render();return}if(type==='forgeSelect'){forgeSelection=arg;render();return}if(type==='profile'){profilePage=arg;tab='hero';render();if(arg==='mail')loadMail();return}if(type==='authMode'){authMode=arg;authMessage='';render();return}if(type==='logout'){logout();return}if(type==='story'&&detail==='resume'&&s.battle?.story&&s.battle.quest===arg){tab='journey';render();return}if(type==='firstPath'&&arg==='accept'&&s.battle?.quest==='firstPath'){tab='journey';render();return}if(s.battle&&!['fight','flee'].includes(type)){notice='Завершите бой перед этим действием.';render();return}
if(type==='story')storyAction(arg,detail);
if(type==='enchantSource'&&['equipped','bag'].includes(arg)){enchantSource=arg;enchantSelection=null}
if(type==='enchantSelect')enchantSelection=arg;
if(type==='enchantStat'&&enchantAllowed(enchantChosen()?.slot).includes(arg))enchantStat=arg;
if(type==='enchantTier'&&Number.isInteger(Number(arg))&&enchantTiers[Number(arg)])enchantTier=Number(arg);
if(type==='applyEnchant')applyEnchantment();
if(type==='bossStart')startBanditChief();
if(type==='firstPath')firstPathAction(arg);
if(type==='sharpen'){const it=arg==='equipped'?s.equipment[detail]:arg==='bag'?s.bag[Number(detail)]:null;if(it){const oldMax=maxhp(),level=it.sharpen||0,cost=sharpenCost(level);if(level<15&&s.dust>=cost){const success=sharpenItem(it);if(success&&arg==='equipped')s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)));notice=success?`${itemName(it)}: заточка успешна.`:`Заточка не удалась. Потрачено ${cost} пыли.`}}}
if(type==='skill'&&skillSpecs.some(skill=>skill.id===arg)&&skillRank(arg)<10&&freeSkillPoints()>0){s.skills[arg]=skillRank(arg)+1;notice='Умение улучшено.'}
if(type==='start'&&s.hp>0){const locationId=Number(arg||0);if(!locations[locationId]||s.level<locations[locationId].min){render();return}s.battle={location:locationId,wave:1,wins:0,enemy:nextFoe(1,-1,locationId),turn:1,cooldown:0,log:[],lastAttackAt:Date.now()-3000,nextBiteAt:Date.now()+3000,guarding:false};tab='journey'}
if(type==='fight')fight(arg);
if(type==='flee'&&s.battle){if(s.battle.story){storyState(s.battle.quest).stage='retry';tavernPage=s.battle.quest}tab=s.battle.story?'town':s.battle.bossId?'bosses':s.battle.quest==='firstPath'?'town':'journey';s.battle=null}
if(type==='potion'&&!s.battle)drinkPotion()
if(type==='unequip'&&s.equipment[arg]){const oldMax=maxhp();s.bag.push(s.equipment[arg]);delete s.equipment[arg];s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)))}
if(type==='salvageAll'&&s.bag.length){const count=s.bag.length,dust=bagDust();s.dust=(s.dust||0)+dust;s.bag=[];notice=`Разобрано ${count} вещей. +${dust} пыли.`}
if(type==='salvage'&&s.bag[Number(arg)]){const item=s.bag.splice(Number(arg),1)[0],dust=dustForItem(item);s.dust=(s.dust||0)+dust;notice=`+${dust} пыли.`}
if(type==='equip'&&s.bag[Number(arg)]){const it=s.bag[Number(arg)];if(s.level<setSpecs[it.set].level){notice=`Требуется ${setSpecs[it.set].level} уровень.`}else{const oldMax=maxhp();s.bag.splice(Number(arg),1);const prev=s.equipment[it.slot];s.equipment[it.slot]=it;if(prev)s.bag.push(prev);s.hp=Math.min(maxhp(),Math.max(0,Math.round(s.hp*maxhp()/oldMax)));notice='Снаряжение надето.'}}
queueCloudSave();render()}
function fight(move){enemyTick();const b=s.battle;if(!b)return;const a=b.enemy,enemyMove=intent(b);if(!['hit','guard','skill','potion'].includes(move)||move==='skill'&&b.cooldown>0||move==='potion'&&!canDrinkPotion())return;
if(move==='potion')drinkPotion();else{const percent=strikePercent(Date.now()-b.lastAttackAt);b.lastAttackAt=Date.now();const critical=Math.random()*100<critPercent();const raw=attack()*(move==='skill'?2:move==='guard'?.45:1)*(critical?1.5:1)*(1+.05*skillRank('assault'))*percent/100;const damage=Math.max(1,Math.round(raw*(a.wounded?1.25:1)*(enemyMove.block??1)*(1-armorReductionPercent(a.armorStat||0)/100)));a.hp=Math.max(0,a.hp-damage);b.log.push(`${move==='skill'?'Мощный выпад':move==='guard'?'Осторожный удар':'Ваш удар'}: ${damage} урона (${Math.round(percent)}%)${critical?' · крит':''}.`);if(move==='guard')b.guarding=true}
if(a.hp<=0&&b.story){storyVictory(b);return}
if(a.hp<=0&&b.bossId){finishBanditChief();return}
if(a.hp<=0&&b.quest==='firstPath'){s.kills++;b.wins++;if(b.wins>=2){s.firstPath='ready';s.battle=null;tab='town';tavernPage='firstPath';notice='Дебоширы усмирены. Вернитесь к Бармену Лайту за наградой.'}else{b.wave++;b.enemy=firstPathEnemy(b.wins);b.turn=1;b.cooldown=0;b.guarding=false;b.lastAttackAt=Date.now()-3000;b.nextBiteAt=Date.now()+3000;b.log.push('Карл усмирён. В бой вступает Пьянчуга Аргос.')}return}
if(a.hp<=0){s.kills++;b.wins++;s.souls=(s.souls||0)+1;s.xp+=a.xp;if(a.kind===5)s.boss++;b.log.push(`+1 душа · +${a.xp} опыта.`);if(rollGearDrop()){const slot=slotSpecs[Math.floor(Math.random()*slotSpecs.length)][0],setId=locations[b.location||0].set,item=makeItem(slot,setId);s.bag.push(item);b.log.push({text:`Найдено: ${itemName(item)}.`,rarity:itemRarity(item).className})}if(Math.random()<.01){s.potions++;b.log.push('Найдено зелье здоровья.')}while(s.xp>=need()){s.xp-=need();s.level++;for(const stat of ['health','str','armorStat','agi'])s[stat]+=5;s.hp=maxhp();b.log.push(`Уровень ${s.level}: +5 к каждому параметру.`)}const previous=a.kind;b.wave++;b.enemy=nextFoe(b.wave,previous,b.location||0);b.turn=1;b.cooldown=0;b.guarding=false;b.nextBiteAt=Date.now()+3000;b.log.push(`Появляется ${b.enemy.name}.`);return}
b.cooldown=move==='skill'?2:Math.max(0,b.cooldown-1)}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action)});document.addEventListener('change',e=>{if(e.target.id==='save-file')importSave(e.target.files?.[0])});document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();submitAuth(e.target)}});if(typeof setInterval==='function')setInterval(()=>{raidTick();enemyTick();const bossButton=document.querySelector?.('.boss-start');if(bossButton){const remaining=bossRemaining();bossButton.textContent='Главарь разбойников · 1 уровень'+(remaining?' · '+bossTime(remaining):'');bossButton.disabled=remaining>0||s.hp<=0||s.level<1||!!s.battle}const button=document.querySelector?.('.arena-attack');if(button&&s.battle)button.textContent=`Атаковать · ${Math.round(strikePercent(Date.now()-s.battle.lastAttackAt))}%`;const potionButton=document.querySelector?.('.potion-use');if(potionButton){potionButton.textContent=potionLabel(!!s.battle);potionButton.disabled=!canDrinkPotion()||tab==='hero'&&!!s.battle}const before=s.hp;applyRegen();if(s.hp!==before){const wasOpen=document.querySelector?.('.stats-tab')?.open;render();if(wasOpen){const stats=document.querySelector?.('.stats-tab');if(stats)stats.open=true}}},250);normalizeSave();render();initDungeons();
</script></body></html>
