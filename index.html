const KEY='pogranichye-v1';
const areas=[{name:'Сумрачный лес',desc:'За старой мельницей снова слышен вой. Расчистите тропу к поселению.',level:1,enemy:'Лесной волк',hp:27,atk:7,xp:18,gold:12},{name:'Заброшенный тракт',desc:'Разбойники собирают дань с караванов. Пора напомнить им, кому принадлежит дорога.',level:2,enemy:'Дозорный разбойников',hp:48,atk:11,xp:32,gold:22},{name:'Старая крепость',desc:'За воротами вас ждёт Серый Клык — главарь банды. Верните покой Вороньему броду.',level:4,enemy:'Серый Клык',hp:95,atk:17,xp:70,gold:60}];
const foes=[{name:'Лесной волк',hp:21,atk:6,xp:12,gold:7,area:0},{name:'Одичавший кабан',hp:29,atk:8,xp:15,gold:8,area:0},{name:'Бродячий разбойник',hp:26,atk:9,xp:17,gold:10,area:1},{name:'Болотный упырь',hp:34,atk:7,xp:18,gold:11,area:0},{name:'Наёмник с щитом',hp:38,atk:10,xp:20,gold:12,area:1},{name:'Серый Клык',hp:70,atk:14,xp:48,gold:30,area:2}];
function nextFoe(wave,previous=-1){let choices=wave%10===0?[5]:[0,1,2,3,4];if(choices.length>1)choices=choices.filter(i=>i!==previous);const kind=choices[Math.floor(Math.random()*choices.length)],base=foes[kind],scale=1+Math.floor((wave-1)/5)*.12+Math.max(0,s.level-1)*.08;return {kind,name:base.name,hp:Math.round(base.hp*scale),maxHp:Math.round(base.hp*scale),atk:Math.round(base.atk*scale),xp:Math.round(base.xp*scale),gold:Math.round(base.gold*scale),area:base.area}}
const fresh=()=>({schema:2,level:1,xp:0,gold:0,hp:50,health:10,str:10,armorStat:10,agi:10,regenAt:Date.now(),potions:3,weapon:0,armor:0,kills:0,boss:0,claimed:false,bag:[],battle:null});

const AUTH_KEY='pogranichye-auth-v1';const cloudConfig=typeof window!=='undefined'?window.POGRAN_SUPABASE:null;let authSession=null,authMode='register',authMessage='',mailMessages=[],mailLoading=false,cloudQueue=Promise.resolve();try{authSession=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{}
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&Number.isFinite(v.level)&&Array.isArray(v.bag)){s={...s,...v};if(v.battle&&!v.battle.wave)s.battle=null;if(v.schema!==2){const level=Math.max(1,v.level);const oldMax=40+(v.vit??5)*4;s.health=s.str=s.armorStat=s.agi=10+5*(level-1);s.hp=Math.round(Math.max(0,Math.min(1,v.hp/oldMax))*s.health*5);s.regenAt=Date.now();s.schema=2;delete s.vit;delete s.points;}}}}catch{storageOK=false}
const maxhp=()=>s.health*5;const attack=()=>s.str+s.weapon;const defense=()=>s.armorStat+s.armor;const armorPercent=()=>100*defense()/(defense()+23.21);const critPercent=()=>Math.min(50,s.agi*.5);const need=()=>s.level*100;

function downloadSave(){save();if(!storageOK){notice='Не удалось сохранить персонажа в этом браузере.';render();return}const data=new Blob([JSON.stringify({game:'pogranichye',version:1,state:s},null,2)],{type:'application/json'});const url=URL.createObjectURL(data);const link=document.createElement('a');link.href=url;link.download='pogranichye-save.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function importSave(file){try{if(!file||file.size>1024*1024)throw Error('Файл сохранения слишком большой.');const data=JSON.parse(await file.text());const state=data?.game==='pogranichye'?data.state:data;if(!state||!Number.isInteger(state.level)||state.level<1||!Array.isArray(state.bag)||!Number.isFinite(state.hp)||!Number.isFinite(state.xp)||!['health','str','armorStat','agi'].every(key=>Number.isFinite(state[key])&&state[key]>=10))throw Error('Это не сохранение Пограничья.');s={...fresh(),...state,battle:null};s.hp=Math.max(0,Math.min(s.hp,maxhp()));save();profilePage='settings';notice='Персонаж восстановлен.';render()}catch(error){notice=error.message;render()}}
function setSession(value){authSession=value;try{if(value)localStorage.setItem(AUTH_KEY,JSON.stringify(value));else localStorage.removeItem(AUTH_KEY)}catch{storageOK=false}}

async function saveCloud(){if(!authSession)return;const session=await validSession();await cloudRequest('/rest/v1/game_saves?on_conflict=user_id',{method:'POST',body:{user_id:session.user.id,state:s},prefer:'resolution=merge-duplicates',token:session.access_token})}
function queueCloudSave(){if(!authSession)return;cloudQueue=cloudQueue.catch(()=>{}).then(()=>saveCloud()).catch(error=>{notice=`Облачное сохранение: ${error.message}`;render()})}
async function loadCloud(){const session=await validSession();const rows=await cloudRequest(`/rest/v1/game_saves?user_id=eq.${encodeURIComponent(session.user.id)}&select=state`,{token:session.access_token});if(rows.length){s={...fresh(),...rows[0].state};render()}else await saveCloud()}
async function loadMail(){if(!authSession){mailMessages=[];mailLoading=false;render();return}mailLoading=true;render();try{const session=await validSession();mailMessages=await cloudRequest('/rest/v1/mail_messages?select=id,subject,body,created_at,read_at&order=created_at.desc',{token:session.access_token})||[]}catch(error){authMessage=error.message}finally{mailLoading=false;render()}}
async function submitAuth(form){const email=form.elements.email.value.trim(),password=form.elements.password.value;authMessage='';try{const signup=authMode==='register';const result=await cloudRequest(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},token:cloudConfig.anonKey});if(!result.access_token){authMessage='Подтвердите адрес электронной почты, затем войдите.';render();return}setSession(result);await loadCloud();profilePage='overview';notice='Вход выполнен.';render()}catch(error){authMessage=error.message;render()}}
async function logout(){if(!authSession){profilePage='auth';render();return}try{await cloudQueue;await saveCloud();await cloudRequest('/auth/v1/logout',{method:'POST'});setSession(null);s=fresh();mailMessages=[];try{localStorage.removeItem(KEY)}catch{}profilePage='auth';tab='hero';authMessage='Вы вышли из аккаунта.';render()}catch(error){authMessage=error.message;profilePage='settings';render()}}

function button(text,action,disabled=false,cls=''){return `<button class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`}
function meter(value,max,cls=''){return `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,value/max*100))}%"></i></div>`}
function render(){applyRegen();save();document.getElementById('gold').textContent=`◈ ${s.gold}`;document.getElementById('current-location').textContent=tab==='journey'&&s.battle?'Окрестности':(tab==='hero'?({overview:'Профиль',gear:'Снаряжение',bag:'Сумка',skills:'Умения',mail:'Почта',stats:'Статистика',settings:'Настройки',auth:'Регистрация'}[profilePage]||'Профиль'):({main:'Главная',journey:'Окрестности',town:'Поселение'}[tab]||'Главная'));const hpPercent=Math.round(s.hp/maxhp()*100),xpPercent=Math.round(s.xp/need()*100);document.getElementById('top-vitals').innerHTML=`<div class="top-meter hp-meter" role="progressbar" aria-label="Здоровье" aria-valuenow="${s.hp}" aria-valuemin="0" aria-valuemax="${maxhp()}"><span class="top-fill" style="width:${hpPercent}%"></span><span class="top-meter-text">♥ ${s.hp} / ${maxhp()}</span></div><div class="top-meter exp-meter" role="progressbar" aria-label="Опыт уровня" aria-valuenow="${s.xp}" aria-valuemin="0" aria-valuemax="${need()}"><span class="top-fill" style="width:${xpPercent}%"></span><span class="top-meter-text">ОПЫТ ${xpPercent}%</span></div>`;document.getElementById('nav').innerHTML=[['main','⌂','На главную'],['hero','♙','Герой'],['town','◇','Дом']].map(([id,icon,name])=>button(`${icon} ${name}`,'tab:'+id,false,tab===id?'active':'')).join('');document.getElementById('app').innerHTML=(tab==='main'||tab==='hero'||tab==='journey')?`${notice?`<div class="notice" role="status">${escapeHtml(notice)}</div>`:''}${!storageOK?'<div class="notice">Браузер не позволяет сохранить прогресс. Не закрывайте страницу.</div>':''}<div class="layout ${tab==='main'?'main-layout':'hero-layout'}"><section>${content()}</section></div>`:`<div class="intro"><div><div class="eyebrow">Хроники Вороньего брода</div><h1>${{main:'Выберите свой путь',hero:'Профиль героя',journey:'За пределами стен',town:'Вороний брод'}[tab]}</h1><span class="muted">${s.boss?'В крепости снова поднят королевский флаг.':'На краю королевства каждый меч имеет значение.'}</span></div><span class="tag">Глава I · Пограничье</span></div>${notice?`<div class="notice" role="status">${escapeHtml(notice)}</div>`:''}${!storageOK?'<div class="notice">Браузер не позволяет сохранить прогресс. Не закрывайте страницу.</div>':''}<div class="layout ${tab==='hero'?'hero-layout':tab==='main'?'main-layout':''}"><aside class="sidebar"><div class="card"><div class="profile"><div class="crest">♜</div><h2>Странник</h2><p class="muted">${s.level<4?'Начинающий наёмник':'Защитник пограничья'} · ${s.level} уровень</p></div><div class="row"><small>Здоровье</small><span>${s.hp} / ${maxhp()}</span></div>${meter(s.hp,maxhp())}<div class="row xp-label"><small>Опыт · уровень ${s.level}</small><small>${s.xp} / ${need()}</small></div>${meter(s.xp,need(),'xp')}<div class="details"><div class="row stat"><span>Атака</span><b>${attack()}</b></div><div class="row stat"><span>Защита</span><b>${defense()}</b></div><div class="row stat"><span>Победы</span><b>${s.kills}</b></div><p class="hint">Прогресс сохраняется в этом браузере автоматически.</p></div></div></aside><section>${content()}</section></div>`}
function content(){if(tab==='main')return mainScreen();if(s.battle&&tab==='journey')return battleView();if(tab==='journey')return `<div class="card arena-entry"><h2>Окрестности</h2>${button('Войти','start',s.hp<=0,'primary full-button')}</div>`;
if(tab==='hero')return profileContent();
return `<div class="card"><div class="eyebrow">Доска поручений</div><h2 style="margin-top:7px">Безопасные дороги</h2><p class="muted">Староста просит очистить окрестности от угроз. Одержите 5 побед в окрестностях.</p><div class="row"><span>Победы: ${Math.min(s.kills,5)} / 5</span><span class="coin">Награда: 50 ◈</span></div>${meter(Math.min(s.kills,5),5)}${button(s.claimed?'Награда получена':'Забрать награду','claim',s.kills<5||s.claimed,'primary')}</div><div class="card"><h2>Таверна «У переправы»</h2><p class="muted">Для защитников поселения всегда найдётся свободная кровать.</p>${button('Отдохнуть · бесплатно','rest',!!s.battle||s.hp===maxhp())}</div><div class="card"><h2>Лавка травника</h2><p class="muted">Малое зелье восстанавливает 30 здоровья. В бою его применение занимает ход.</p>${button('Купить зелье · 15 ◈','buy',s.gold<15||!!s.battle)}</div>${s.battle?'<p class="danger">Сначала завершите бой или отступите в «Окрестностях».</p>':''}`}
function mainScreen(){return `<div class="main-choices"><button class="main-choice" data-action="tab:journey"><span class="choice-icon">⚔</span><span class="choice-copy"><small>ПРИКЛЮЧЕНИЕ</small><strong>${s.battle?'Вернуться в бой':'Окрестности'}</strong><span>${s.battle?'Противник ждёт вашего хода':'Непрерывные бои и добыча'}</span></span></button><button class="main-choice" data-action="tab:town"><span class="choice-icon">⌂</span><span class="choice-copy"><small>ВОРОНИЙ БРОД</small><strong>Поселение</strong><span>Отдых, задания и лавка травника</span></span></button></div>`}
function equipmentSlot(label,icon,value=''){return `<div class="equipment-slot ${value?'is-equipped':''}" title="${label}" aria-label="${label}${value?' '+value:''}"><span>${icon}</span>${value?`<b>${value}</b>`:''}</div>`}
function profileContent(){if(profilePage==='overview')return heroProfile();const back=button('← Профиль','profile:overview',false,'profile-back');const pages={gear:profileGear,bag:profileBag,skills:profileSkills,mail:profileMail,stats:profileStats,settings:profileSettings,auth:profileAuth};return back+(pages[profilePage]||heroProfile)()}
function profileLink(label,page){return `<button class="profile-link" data-action="profile:${page}"><span>${label}</span></button>`}
function heroProfile(){const percent=Math.round(s.xp/need()*100);return `<div class="equipment-card card"><div class="equipment-heading"><h2>Странник <span>· ${s.level} уровень</span></h2></div><div class="equipment-display"><div class="slot-column">${equipmentSlot('Голова','♙')}${equipmentSlot('Плечи','◈')}${equipmentSlot('Перчатки','✧')}${equipmentSlot('Ноги','⌁')}${equipmentSlot('Доспех',s.armor?'♜':'◇',s.armor?'+'+s.armor:'')}</div><div class="character-frame"><img src="knight.webp" alt="Рыцарь в доспехах" loading="eager"></div><div class="slot-column">${equipmentSlot('Шея','◇')}${equipmentSlot('Плащ','⌁')}${equipmentSlot('Кольцо','◌')}${equipmentSlot('Оружие','⚔',s.weapon?'+'+s.weapon:'')}${equipmentSlot('Обувь','◇')}</div></div></div><div class="card profile-section parameter-card"><div class="parameter-row"><span>Здоровье:</span><b>${s.health}</b><small>(${maxhp()}, +1/сек.)</small></div><div class="parameter-row"><span>Сила:</span><b>${s.str}</b></div><div class="parameter-row"><span>Броня:</span><b>${s.armorStat}</b><small>(${armorPercent().toFixed(2)}%)</small></div><div class="parameter-row"><span>Ловкость:</span><b>${s.agi}</b><small>(${critPercent().toFixed(2)}% шанс крита)</small></div><div class="parameter-total"><span>Сумма параметров:</span><b>${s.health+s.str+s.armorStat+s.agi}</b></div></div><div class="profile-links card">${profileLink('Снаряжение','gear')}${profileLink('Сумка','bag')}${profileLink('Умения','skills')}${profileLink('Почта','mail')}</div><div class="profile-experience card">Опыт: ${s.xp}/${need()} (${percent}%)</div><div class="card profile-currency"><div>Деньги: <b>${s.gold} зол.</b> <b>${s.silver||0} сер.</b> <b>${s.bronze||0} бронзы</b></div><div>Души: <b>${s.souls||0}</b></div><div>Пыль: <b>${s.dust||0}</b></div></div><div class="card premium-line">Премиум: в разработке</div><div class="profile-links card">${profileLink('Статистика','stats')}${profileLink('Настройки','settings')}</div>`}
function profileGear(){return `<div class="card profile-section"><h2>Снаряжение</h2><div class="gear-slot"><span class="slot-icon">⚔</span><div><small>ОРУЖИЕ</small><b>${s.weapon?'Стальной меч':'Старый меч'}</b><small>${s.weapon?'+'+s.weapon+' к атаке':'Базовое оружие'}</small></div></div><div class="gear-slot"><span class="slot-icon">♜</span><div><small>ДОСПЕХ</small><b>${s.armor?'Кожаный доспех':'Дорожная одежда'}</b><small>${s.armor?'+'+s.armor+' к защите':'Базовая защита'}</small></div></div></div>`}
function profileBag(){return `<div class="card profile-section"><h2>Сумка</h2><div class="inventory-row"><span class="inventory-icon potion-icon">✚</span><div class="inventory-text"><b>Малое зелье здоровья <em>× ${s.potions}</em></b><small>Восстанавливает 30 здоровья</small></div>${button('Выпить','potion',s.potions<1||s.hp===maxhp()||!!s.battle,'inventory-action')}</div>${s.bag.map((it,i)=>`<div class="inventory-row"><span class="inventory-icon">${it.type==='weapon'?'⚔':'♜'}</span><div class="inventory-text"><b>${it.type==='weapon'?'Стальной меч':'Кожаный доспех'}</b><small>+${it.value} к ${it.type==='weapon'?'атаке':'защите'}</small></div><div class="inventory-actions">${button('Надеть','equip:'+i,!!s.battle,'inventory-action')}${button('Продать · 8 ◈','sell:'+i,!!s.battle,'subtle-action')}</div></div>`).join('')}${!s.bag.length?'<div class="empty-bag">Пусто</div>':''}</div>`}
function profileSkills(){return `<div class="card profile-section"><h2>Умения</h2><div class="skill-row"><b>Удар</b><span>Обычный урон</span></div><div class="skill-row"><b>Защита</b><span>−70% входящего урона</span></div><div class="skill-row"><b>Мощный выпад</b><span>Двойной урон, 2 хода восстановления</span></div></div>`}
function profileMail(){return `<div class="card profile-section"><h2>Почта</h2>${mailLoading?'<div class="empty-bag">Загрузка…</div>':mailMessages.length?mailMessages.map(m=>`<article class="mail-item"><b>${escapeHtml(m.subject)}</b><p>${escapeHtml(m.body)}</p></article>`).join(''):'<div class="empty-bag">Нет писем</div>'}</div>`}
function profileStats(){return `<div class="card profile-section"><h2>Статистика</h2><div class="stats-content"><span>Победы</span><strong>${s.kills}</strong></div><div class="stats-content"><span>Побеждённые главари</span><strong>${s.boss}</strong></div></div>`}
function profileSettings(){return `<div class="card profile-section"><h2>Настройки</h2>${authSession?`<div class="account-email">${escapeHtml(authSession.user.email)}</div>`:'<div class="account-email">Тестовый персонаж · сохранение в этом браузере</div>'}${button('Скачать сохранение','downloadSave',false,'full-button')}<label class="full-button save-upload">Загрузить сохранение<input id="save-file" type="file" accept=".json,application/json"></label>${cloudConfig&&!authSession?button('Регистрация и вход','profile:auth',false,'full-button'):''}${authSession?button('Выйти','logout',false,'full-button'):''}</div>`}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function profileAuth(){return `<div class="card profile-section"><h2>${authMode==='register'?'Регистрация':'Вход'}</h2>${authMessage?`<div class="notice" role="status">${escapeHtml(authMessage)}</div>`:''}${cloudConfig?'':'<div class="notice">База данных ещё не подключена.</div>'}<form id="auth-form" class="auth-form"><label>Почта<input name="email" type="email" autocomplete="email" required></label><label>Пароль<input name="password" type="password" minlength="8" autocomplete="${authMode==='register'?'new-password':'current-password'}" required></label><button type="submit" class="primary" ${cloudConfig?'':'disabled'}>${authMode==='register'?'Зарегистрироваться':'Войти'}</button></form>${button(authMode==='register'?'Уже есть аккаунт? Войти':'Создать аккаунт','authMode:'+(authMode==='register'?'signin':'register'),false,'auth-switch')}</div>`}
const patterns=[
 [{name:'Обычный укус',detail:'Обычная атака.',power:1}, {name:'Прыжок',detail:'Сильный удар. Защита снизит урон.',power:1.8}, {name:'Переводит дух',detail:'Слабая атака. Удобный момент для выпада.',power:.5}],
 [{name:'Поднимает щит',detail:'Получит меньше урона в этот ход.',power:.6,block:.35}, {name:'Удар клинком',detail:'Обычная атака.',power:1}, {name:'Замах',detail:'Сильный удар. Защита снизит урон.',power:1.7}],
 [{name:'Тяжёлый замах',detail:'Очень сильный удар. Защита снизит урон.',power:1.9}, {name:'Прикрывается',detail:'Получит меньше урона в этот ход.',power:.75,block:.5}, {name:'Быстрый выпад',detail:'Обычная атака.',power:1}]
];
function intent(b){return patterns[b.enemy.area][(b.turn-1)%patterns[b.enemy.area].length]}
function battleView(){const b=s.battle,a=b.enemy;return `<div class="card arena-battle"><div class="eyebrow">ОКРЕСТНОСТИ · ПРОТИВНИК ${b.wave}</div><h2>${a.name}</h2><div class="row"><small>Здоровье противника</small><span>${a.hp} / ${a.maxHp}</span></div>${meter(a.hp,a.maxHp)}<div class="arena-pending">Победы: ${b.wins} · Добыча: ${b.loot} зол.</div><div class="intent"><strong>${intent(b).name}</strong> · ${intent(b).detail}</div>${button('Атаковать','fight:hit',false,'primary arena-attack')}<div class="actions arena-tools">${button('Защита','fight:guard')}${button(b.cooldown?'Выпад · '+b.cooldown:'Мощный выпад','fight:skill',b.cooldown>0)}${button('Зелье · '+s.potions,'fight:potion',!s.potions||s.hp===maxhp())}</div>${button('Покинуть локацию','flee',false,'full-button')}</div><div class="card"><h3>Хроника боя</h3><div class="log" aria-live="polite">${b.log.slice(-4).map(l=>`<p>${escapeHtml(l)}</p>`).join('')}</div></div>`}
function act(action){const [type,arg]=action.split(':');notice='';if(type==='downloadSave'){downloadSave();return}if(type==='tab'){tab=arg;if(arg==='hero')profilePage='overview';render();return}if(type==='profile'){profilePage=arg;tab='hero';render();if(arg==='mail')loadMail();return}if(type==='authMode'){authMode=arg;authMessage='';render();return}if(type==='logout'){logout();return}if(s.battle&&!['fight','flee'].includes(type)){notice='Завершите бой перед этим действием.';render();return}
if(type==='start'&&s.hp>0){s.battle={wave:1,wins:0,loot:0,enemy:nextFoe(1),turn:1,cooldown:0,log:[]};tab='journey'}
if(type==='fight')fight(arg);
if(type==='flee'&&s.battle){const loot=s.battle.loot;s.gold+=loot;s.battle=null;notice=`Вы покинули окрестности. Получено ${loot} золота.`;tab='journey'}
if(type==='rest'){s.hp=maxhp();notice='Вы отдохнули. Здоровье полностью восстановлено.'}
if(type==='buy'&&s.gold>=15){s.gold-=15;s.potions++;notice='Зелье добавлено в сумку.'}
if(type==='potion'&&s.potions&&s.hp<maxhp()){s.potions--;s.hp=Math.min(maxhp(),s.hp+30)}
if(type==='claim'&&s.kills>=5&&!s.claimed){s.claimed=true;s.gold+=50;notice='Староста благодарит вас. Получено 50 золота.'}
if(['equip','sell'].includes(type)&&s.bag[Number(arg)]){const it=s.bag.splice(Number(arg),1)[0];if(type==='sell')s.gold+=8;else{const prev=s[it.type];s[it.type]=it.value;if(prev)s.bag.push({type:it.type,value:prev});notice='Снаряжение надето.'}}
queueCloudSave();render()}
function fight(move){const b=s.battle;if(!b)return;const a=b.enemy,enemyMove=intent(b);if(!['hit','guard','skill','potion'].includes(move)||move==='skill'&&b.cooldown>0||move==='potion'&&(!s.potions||s.hp===maxhp()))return;
if(move==='potion'){s.potions--;const heal=Math.min(30,maxhp()-s.hp);s.hp+=heal;b.log.push(`Зелье восстановило ${heal} здоровья.`)}else{const critical=Math.random()*100<critPercent();const raw=Math.max(1,Math.round(attack()*(move==='skill'?2:move==='guard'?.45:1)*(critical?1.5:1)));const damage=Math.max(1,Math.round(raw*(enemyMove.block??1)));a.hp=Math.max(0,a.hp-damage);b.log.push(`${move==='skill'?'Мощный выпад':move==='guard'?'Осторожный удар':'Ваш удар'}: ${damage} урона${critical?' (крит)':''}.`)}
if(a.hp<=0){s.kills++;b.wins++;b.loot+=a.gold;s.xp+=a.xp;if(a.kind===5)s.boss++;notice=`${a.name} повержен. +${a.xp} опыта, ${a.gold} золота в добычу.`;if(s.kills%2===0){const type=s.kills%4===0?'armor':'weapon';s.bag.push({type,value:2+Math.floor(s.level/2)+Math.floor(b.wave/10)});notice+=' Найдено снаряжение.'}while(s.xp>=need()){s.xp-=need();s.level++;for(const stat of ['health','str','armorStat','agi'])s[stat]+=5;s.hp=maxhp();notice+=` Уровень ${s.level}: +5 к каждому параметру.`}const previous=a.kind;b.wave++;b.enemy=nextFoe(b.wave,previous);b.turn=1;b.cooldown=0;b.log.push(`${a.name} повержен. Появляется ${b.enemy.name}.`);return}
const damage=Math.max(1,Math.round(a.atk*(1-armorPercent()/100)*enemyMove.power*(move==='guard'?.3:1)));s.hp=Math.max(0,s.hp-damage);b.log.push(`${a.name}: ${damage} урона вам.`);b.cooldown=move==='skill'?2:Math.max(0,b.cooldown-1);b.turn++;
if(s.hp===0){const kept=Math.floor(b.loot/2);s.gold+=kept;s.battle=null;notice=`Поражение. Сохранено ${kept} золота из добычи. Отдохните в поселении.`;tab='town'}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action)});document.addEventListener('change',e=>{if(e.target.id==='save-file')importSave(e.target.files?.[0])});document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();submitAuth(e.target)}});if(typeof setInterval==='function')setInterval(()=>{const before=s.hp;applyRegen();if(s.hp!==before){const wasOpen=document.querySelector?.('.stats-tab')?.open;render();if(wasOpen){const stats=document.querySelector?.('.stats-tab');if(stats)stats.open=true}}},1000);render();
</script></body></html>
